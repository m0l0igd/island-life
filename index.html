#joy-knob{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.55);border:2px solid rgba(255,255,255,.8);position:absolute;top:28px;left:28px;pointer-events:none}
#action-btns{position:fixed;bottom:20px;right:16px;z-index:60;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.abtn{width:58px;height:58px;border-radius:50%;border:2px solid rgba(255,255,255,.5);color:#fff;font-size:1.1rem;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:none}

.panel{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -6px 40px rgba(0,0,0,.25);z-index:80;transform:translateY(100%);transition:transform .35s cubic-bezier(.34,1.3,.64,1);max-height:85vh;overflow-y:auto}
.panel.open{transform:translateY(0)}
.ph{width:36px;height:4px;background:#ddd;border-radius:2px;margin:12px auto 10px}
.ptitle{font-size:1.1rem;font-weight:900;color:#2a7a2a;text-align:center;margin-bottom:12px}
.closebtn{position:absolute;top:12px;right:14px;background:#f0f0f0;border:none;border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:1rem}
.pinner{padding:0 16px 24px}

.btn{background:#2a7a2a;color:#fff;border:none;border-radius:10px;padding:10px 22px;font-size:.88rem;font-weight:700;cursor:pointer;margin:4px}

.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:10px;margin-top:10px}
.scard{background:#f8f8f8;border:2px solid #eee;border-radius:10px;padding:9px 6px;text-align:center;cursor:pointer;transition:all .15s}

.nbg{flex:1;height:11px;background:#eee;border-radius:5px;overflow:hidden}
.nfill{height:100%;border-radius:5px;transition:width .4s}

.csw{width:30px;height:30px;border-radius:50%;border:3px solid transparent;cursor:pointer}

// DRAW CHARACTER (improved proportions)
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function drawChar(ctx2, cx, cy, ch, scale, dir, frame, shadow){
  var s=scale||1;
  var sk=SKINS[ch.skin||0], hc=HAIRC[ch.hairc||0], ec=EYEC[ch.eyec||0];
  var out=OUTFITS[ch.outfit||0];
  // Shadow
  if(shadow){ctx2.globalAlpha=.22;ctx2.fillStyle='#000';ctx2.beginPath();ctx2.ellipse(cx,cy+2*s,12*s,4*s,0,0,Math.PI*2);ctx2.fill();ctx2.globalAlpha=1;}
  // Leg animation
  var legSwing=(dir==='left'||dir==='right')&&frame%2===0;
  var lOff=legSwing?3*s:0;
  // Legs
  ctx2.fillStyle='#2255a0';
  ctx2.beginPath();ctx2.roundRect(cx-6*s,cy-8*s,7*s,12*s,3*s);ctx2.fill();
  ctx2.beginPath();ctx2.roundRect(cx,cy-8*s+lOff,7*s,12*s,3*s);ctx2.fill();
  // Shoes
  ctx2.fillStyle='#e8e8f0';
  ctx2.beginPath();ctx2.roundRect(cx-7*s,cy+3*s,8*s,4*s,2*s);ctx2.fill();
  ctx2.beginPath();ctx2.roundRect(cx,cy+3*s+lOff,8*s,4*s,2*s);ctx2.fill();
  // Body (rounder, less blocky)
  ctx2.fillStyle=out.c;
  ctx2.beginPath();ctx2.roundRect(cx-9*s,cy-24*s,18*s,18*s,5*s);ctx2.fill();
  // Outfit detail
  if(ch.outfit===1){// plaid
    ctx2.strokeStyle=out.c2;ctx2.lineWidth=1.5*s;
    for(var li=0;li<3;li++){ctx2.beginPath();ctx2.moveTo(cx-9*s+li*6*s,cy-24*s);ctx2.lineTo(cx-9*s+li*6*s,cy-6*s);ctx2.stroke();}
    ctx2.beginPath();ctx2.moveTo(cx-9*s,cy-17*s);ctx2.lineTo(cx+9*s,cy-17*s);ctx2.stroke();
  }
  if(ch.outfit===3){// walmart spark
    ctx2.fillStyle='#ffc220';ctx2.font='bold '+(7*s)+'px serif';ctx2.textAlign='center';ctx2.fillText('★',cx,cy-12*s);
  }
  // Arms (swing with walk)
  var armSwing=frame%2===0?2*s:-2*s;
  ctx2.fillStyle=out.c;
  ctx2.beginPath();ctx2.roundRect(cx-14*s,cy-23*s+armSwing,5*s,10*s,3*s);ctx2.fill();
  ctx2.beginPath();ctx2.roundRect(cx+9*s,cy-23*s-armSwing,5*s,10*s,3*s);ctx2.fill();
  // Hands
  ctx2.fillStyle=sk;
  ctx2.beginPath();ctx2.arc(cx-11*s,cy-13*s+armSwing,3.5*s,0,Math.PI*2);ctx2.fill();
  ctx2.beginPath();ctx2.arc(cx+12*s,cy-13*s-armSwing,3.5*s,0,Math.PI*2);ctx2.fill();
  // Neck
  ctx2.fillStyle=sk;ctx2.beginPath();ctx2.roundRect(cx-3*s,cy-28*s,6*s,6*s,2*s);ctx2.fill();
  // HEAD — rounder, more proportional
  ctx2.fillStyle=sk;ctx2.beginPath();ctx2.ellipse(cx,cy-36*s,11*s,12*s,0,0,Math.PI*2);ctx2.fill();
  // Ears
  ctx2.fillStyle=sk;
  ctx2.beginPath();ctx2.ellipse(cx-11*s,cy-36*s,3.5*s,4*s,0,0,Math.PI*2);ctx2.fill();
  ctx2.beginPath();ctx2.ellipse(cx+11*s,cy-36*s,3.5*s,4*s,0,0,Math.PI*2);ctx2.fill();
  // Hair
  ctx2.fillStyle=hc;
  var hi=ch.hair||0;
  if(hi===0){ctx2.beginPath();ctx2.ellipse(cx,cy-42*s,11*s,7*s,0,0,Math.PI*2);ctx2.fill();ctx2.beginPath();ctx2.roundRect(cx-12*s,cy-44*s,4*s,8*s,2*s);ctx2.fill();ctx2.beginPath();ctx2.roundRect(cx+8*s,cy-44*s,4*s,8*s,2*s);ctx2.fill();}
  else if(hi===1){ctx2.beginPath();ctx2.ellipse(cx,cy-42*s,11*s,7*s,0,0,Math.PI*2);ctx2.fill();ctx2.beginPath();ctx2.roundRect(cx-11*s,cy-42*s,5*s,22*s,3*s);ctx2.fill();ctx2.beginPath();ctx2.roundRect(cx+6*s,cy-42*s,5*s,22*s,3*s);ctx2.fill();}
  else if(hi===2){ctx2.beginPath();ctx2.ellipse(cx,cy-43*s,12*s,9*s,0,0,Math.PI*2);ctx2.fill();[[-7,-50],[0,-53],[7,-50],[-11,-44],[11,-44]].forEach(function(p){ctx2.beginPath();ctx2.arc(cx+p[0]*s,cy+p[1]*s,5*s,0,Math.PI*2);ctx2.fill();});}
  else if(hi===3){ctx2.globalAlpha=.55;ctx2.beginPath();ctx2.ellipse(cx,cy-42*s,11*s,6*s,0,0,Math.PI*2);ctx2.fill();ctx2.globalAlpha=1;}
  else if(hi===4){ctx2.beginPath();ctx2.ellipse(cx,cy-43*s,11*s,7*s,0,0,Math.PI*2);ctx2.fill();ctx2.beginPath();ctx2.arc(cx,cy-50*s,7*s,0,Math.PI*2);ctx2.fill();}
  else{ctx2.beginPath();ctx2.ellipse(cx,cy-42*s,11*s,7*s,0,0,Math.PI*2);ctx2.fill();[-5,0,5].forEach(function(ox){ctx2.beginPath();ctx2.moveTo(cx+ox*s,cy-46*s);ctx2.lineTo(cx+(ox-3)*s,cy-55*s);ctx2.lineTo(cx+(ox+3)*s,cy-55*s);ctx2.closePath();ctx2.fill();});}
  // EYES — small, expressive, not huge
  ctx2.fillStyle='#fff';
  ctx2.beginPath();ctx2.ellipse(cx-5*s,cy-37*s,3.5*s,3*s,0,0,Math.PI*2);ctx2.fill();
  ctx2.beginPath();ctx2.ellipse(cx+5*s,cy-37*s,3.5*s,3*s,0,0,Math.PI*2);ctx2.fill();
  ctx2.fillStyle=ec;
  ctx2.beginPath();ctx2.arc(cx-5*s,cy-37*s,2*s,0,Math.PI*2);ctx2.fill();
  ctx2.beginPath();ctx2.arc(cx+5*s,cy-37*s,2*s,0,Math.PI*2);ctx2.fill();
  ctx2.fillStyle='#111';
  ctx2.beginPath();ctx2.arc(cx-5*s,cy-37*s,1*s,0,Math.PI*2);ctx2.fill();
  ctx2.beginPath();ctx2.arc(cx+5*s,cy-37*s,1*s,0,Math.PI*2);ctx2.fill();
  ctx2.fillStyle='#fff';
  ctx2.beginPath();ctx2.arc(cx-4*s,cy-38*s,.8*s,0,Math.PI*2);ctx2.fill();
  ctx2.beginPath();ctx2.arc(cx+6*s,cy-38*s,.8*s,0,Math.PI*2);ctx2.fill();
  // Nose (tiny, just a small bump)
  ctx2.fillStyle='rgba(160,100,60,.4)';
  ctx2.beginPath();ctx2.ellipse(cx,.5*s+cy-33*s,1.5*s,1*s,0,0,Math.PI*2);ctx2.fill();
  // Mouth (simple smile arc, small)
  ctx2.strokeStyle='rgba(100,50,30,.6)';ctx2.lineWidth=1.2*s;ctx2.lineCap='round';
  ctx2.beginPath();ctx2.arc(cx,cy-32*s,3*s,.15,Math.PI-.15);ctx2.stroke();
  // Cheeks (subtle)
  ctx2.globalAlpha=.2;ctx2.fillStyle='#ff8888';
  ctx2.beginPath();ctx2.ellipse(cx-8*s,cy-34*s,3*s,2*s,0,0,Math.PI*2);ctx2.fill();
  ctx2.beginPath();ctx2.ellipse(cx+8*s,cy-34*s,3*s,2*s,0,0,Math.PI*2);ctx2.fill();
  ctx2.globalAlpha=1;
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// WORLD RENDER
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
var gameTick=0;
function renderWorld(){
  ctx.clearRect(0,0,cv.width,cv.height);
  var ox=Math.round(cam.x),oy=Math.round(cam.y);
  function wx(x){return x-ox;}function wy(y){return y-oy+46;}

  // Grass base
  var gg=ctx.createLinearGradient(0,0,0,cv.height);gg.addColorStop(0,'#5dbb63');gg.addColorStop(1,'#4aaa50');
  ctx.fillStyle=gg;ctx.fillRect(0,0,cv.width,cv.height);

  // Grass texture patches
  ctx.globalAlpha=.12;
  for(var gp=0;gp<30;gp++){var gpx=(gp*173+ox*.5)%VW,gpy=(gp*97+oy*.5)%VH;ctx.fillStyle='#2a8a2a';ctx.beginPath();ctx.ellipse(gpx,gpy+46,20+gp%15,12+gp%8,0,0,Math.PI*2);ctx.fill();}
  ctx.globalAlpha=1;

  // Horizontal roads (stone-ish paths)
  var roads=[{y:300,h:55},{y:790,h:55},{y:1080,h:50}];
  roads.forEach(function(r){
    var sy=wy(r.y),ey=wy(r.y+r.h);if(sy>VH+46||ey<46)return;
    ctx.fillStyle='#b8b0a0';ctx.fillRect(0,sy,VW,r.h);
    ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(0,sy,VW,3);
    // Lane markings
    ctx.setLineDash([18,14]);ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(0,sy+r.h/2);ctx.lineTo(VW,sy+r.h/2);ctx.stroke();ctx.setLineDash([]);
    // Sidewalk edge
    ctx.fillStyle='#ccc';ctx.fillRect(0,sy+r.h-6,VW,6);
  });
  // Vertical connecting path
  ctx.fillStyle='#b8b0a0';
  var vx=wx(950);ctx.fillRect(vx,wy(300),48,wy(1130)-wy(300));

  // River
  var ry1=wy(RIVER_Y1),ry2=wy(RIVER_Y2);
  if(ry1<VH+46&&ry2>46){
    var rg=ctx.createLinearGradient(0,ry1,0,ry2);rg.addColorStop(0,'#3890e8');rg.addColorStop(1,'#1a70c8');
    ctx.fillStyle=rg;ctx.fillRect(0,ry1,VW,ry2-ry1);
    // Ripples
    ctx.globalAlpha=.3;ctx.strokeStyle='#fff';ctx.lineWidth=1.5;
    for(var ri=0;ri<5;ri++){
      var rwx=((ri*220+gameTick*0.8)%VW);
      ctx.beginPath();ctx.arc(rwx,ry1+(ry2-ry1)/2,12+ri*8,0,Math.PI);ctx.stroke();
    }
    ctx.globalAlpha=1;
    // River banks
    ctx.fillStyle='#8a7050';ctx.fillRect(0,ry1-4,VW,6);ctx.fillRect(0,ry2-2,VW,6);
    // Bridges
    [400,950,1550].forEach(function(bx){
      var bsx=wx(bx);
      ctx.fillStyle='#9a8060';ctx.fillRect(bsx,ry1-2,60,ry2-ry1+4);
      ctx.fillStyle='#aa9070';ctx.fillRect(bsx,ry1-4,60,5);ctx.fillRect(bsx,ry2,60,5);
      // Bridge rails
      ctx.fillStyle='#c0a080';ctx.fillRect(bsx,ry1-4,5,ry2-ry1+8);ctx.fillRect(bsx+55,ry1-4,5,ry2-ry1+8);
    });
  }

  // Flowers (sorted, clipped)
  FLOWERS.forEach(function(f){
    var fx2=wx(f.x),fy2=wy(f.y);if(fx2<-20||fx2>VW+20||fy2<30||fy2>VH+80)return;
    ctx.font='13px serif';ctx.textAlign='center';ctx.fillText(f.e,fx2,fy2);
  });

  // Trees
  var sortedTrees=TREES.slice().sort(function(a,b){return a.y-b.y;});
  sortedTrees.forEach(function(t){
    var tx=wx(t.x),ty=wy(t.y);if(tx<-60||tx>VW+60||ty<-60||ty>VH+100)return;
    // Shadow
    ctx.globalAlpha=.2;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(tx,ty+t.r*.3,t.r*.6,t.r*.2,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
    // Trunk
    ctx.fillStyle='#7a5030';ctx.beginPath();ctx.roundRect(tx-5,ty-t.r*.5,10,t.r*.8,3);ctx.fill();
    // Canopy (3 layers for lush look)
    ctx.fillStyle='#2a7a20';ctx.beginPath();ctx.arc(tx,ty-t.r*.6,t.r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=t.col;ctx.beginPath();ctx.arc(tx-t.r*.3,ty-t.r*.5,t.r*.75,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(tx+t.r*.3,ty-t.r*.4,t.r*.75,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.08)';ctx.beginPath();ctx.arc(tx-t.r*.2,ty-t.r*.8,t.r*.4,0,Math.PI*2);ctx.fill();
  });

  // Buildings
  BUILDINGS.forEach(function(b){
    var bx=wx(b.x),by=wy(b.y);if(bx+b.w<-10||bx>VW+10||by+b.h<46||by>VH+100)return;
    // Shadow
    ctx.globalAlpha=.18;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(bx+b.w/2,by+b.h+4,b.w*.45,8,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
    // Walls
    var wg=ctx.createLinearGradient(bx,by,bx+b.w,by+b.h);wg.addColorStop(0,lighten(b.col,.1));wg.addColorStop(1,b.col);
    ctx.fillStyle=wg;ctx.beginPath();ctx.roundRect(bx,by,b.w,b.h,6);ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.12)';ctx.lineWidth=1.5;ctx.beginPath();ctx.roundRect(bx,by,b.w,b.h,6);ctx.stroke();
    // Roof (triangle)
    ctx.fillStyle=b.roof;ctx.beginPath();ctx.moveTo(bx-8,by);ctx.lineTo(bx+b.w/2,by-40);ctx.lineTo(bx+b.w+8,by);ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.15)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(bx-8,by);ctx.lineTo(bx+b.w/2,by-40);ctx.lineTo(bx+b.w+8,by);ctx.closePath();ctx.stroke();
    // Roof ridge
    ctx.fillStyle='rgba(255,255,255,.2)';ctx.beginPath();ctx.moveTo(bx+b.w*.2,by-18);ctx.lineTo(bx+b.w/2,by-40);ctx.lineTo(bx+b.w*.35,by-20);ctx.closePath();ctx.fill();
    // Windows (2x2 grid)
    var ww=b.w/3-12,wh=28;
    ctx.fillStyle='rgba(180,220,255,.75)';
    ctx.strokeStyle='rgba(100,150,200,.5)';ctx.lineWidth=1.5;
    [[bx+10,by+12],[bx+b.w-ww-10,by+12],[bx+10,by+44],[bx+b.w-ww-10,by+44]].forEach(function(wp){
      if(wp[1]+wh<by+b.h-16){ctx.fillRect(wp[0],wp[1],ww,wh);ctx.strokeRect(wp[0],wp[1],ww,wh);
        // Window pane cross
        ctx.strokeStyle='rgba(100,150,200,.4)';ctx.beginPath();ctx.moveTo(wp[0]+ww/2,wp[1]);ctx.lineTo(wp[0]+ww/2,wp[1]+wh);ctx.moveTo(wp[0],wp[1]+wh/2);ctx.lineTo(wp[0]+ww,wp[1]+wh/2);ctx.stroke();}
    });
    // Door
    ctx.fillStyle='rgba(60,30,10,.75)';ctx.beginPath();ctx.roundRect(bx+b.w/2-10,by+b.h-30,20,30,[8,8,0,0]);ctx.fill();
    ctx.fillStyle='rgba(255,200,80,.6)';ctx.beginPath();ctx.arc(bx+b.w/2+6,by+b.h-16,2.5,0,Math.PI*2);ctx.fill();
    // Sign
    ctx.fillStyle='rgba(20,20,20,.72)';ctx.beginPath();ctx.roundRect(bx+b.w/2-36,by+4,72,20,5);ctx.fill();
    ctx.font='bold 10px Arial';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.fillText(b.n,bx+b.w/2,by+18);
    // Emoji
    ctx.font='18px serif';ctx.fillText(b.emoji,bx+b.w/2,by-10);
    // Entry glow when player near
    var pdist=Math.hypot(player.x-b.door.x,player.y-b.door.y);
    if(pdist<55){
      ctx.globalAlpha=.25+.15*Math.sin(gameTick*.1);ctx.fillStyle='#ffff00';
      ctx.beginPath();ctx.ellipse(wx(b.door.x),wy(b.door.y),18,6,0,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=1;
      ctx.font='bold 11px Arial';ctx.textAlign='center';ctx.fillStyle='#fff';
      ctx.strokeStyle='rgba(0,0,0,.8)';ctx.lineWidth=3;
      ctx.strokeText('Press A to enter',wx(b.door.x),wy(b.door.y)-14);
      ctx.fillText('Press A to enter',wx(b.door.x),wy(b.door.y)-14);
    }
  });

  // Fountain (center landmark)
  var fc=wx(970),fr=wy(600);
  ctx.fillStyle='#7ab8e8';ctx.beginPath();ctx.arc(fc,fr,28,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#5a98c8';ctx.beginPath();ctx.arc(fc,fr,22,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.6)';ctx.beginPath();ctx.arc(fc,fr,4,0,Math.PI*2);ctx.fill();
  // Water spray
  for(var fi=0;fi<6;fi++){var fa=fi/6*Math.PI*2+gameTick*.05;ctx.globalAlpha=.5;ctx.fillStyle='#b0d8ff';ctx.beginPath();ctx.arc(fc+Math.cos(fa)*8,fr+Math.sin(fa)*8-5,2.5,0,Math.PI*2);ctx.fill();}
  ctx.globalAlpha=1;
  ctx.fillStyle='#8a7050';ctx.beginPath();ctx.arc(fc,fr,28,0,Math.PI*2);ctx.stroke=function(){};
  ctx.strokeStyle='#8a7050';ctx.lineWidth=4;ctx.beginPath();ctx.arc(fc,fr,28,0,Math.PI*2);ctx.stroke();
  ctx.font='10px Arial';ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,.9)';ctx.fillText('⛲',fc,fr+4);

  // NPCs (sorted by y)
  NPCS.forEach(function(n){
    n.ftick++;if(n.ftick%12===0&&(Math.abs(n.dx)>.01||Math.abs(n.dy)>.01))n.frame=(n.frame+1)%4;
    drawChar(ctx,wx(n.x),wy(n.y),n,1,n.dir,n.frame,true);

    ctx.fillStyle='#fff';ctx.fillText(n.name,wx(n.x),wy(n.y)-52);
    // Mood bubble
    ctx.font='12px serif';ctx.fillText(n.mood,wx(n.x),wy(n.y)-68);
  });

  // Player
  player.ftick++;if(player.ftick%10===0&&(Math.abs(player.dx)>.01||Math.abs(player.dy)>.01))player.frame=(player.frame+1)%4;
  drawChar(ctx,wx(player.x),wy(player.y),player,1.08,player.dir,player.frame,true);
  // Player name
  ctx.font='bold 9px Arial';ctx.textAlign='center';
  ctx.fillStyle='rgba(0,80,0,.7)';ctx.fillRect(wx(player.x)-20,wy(player.y)-66,40,13);
  ctx.fillStyle='#fff';ctx.fillText(player.name,wx(player.x),wy(player.y)-55);

  // Fade overlay
  if(G.fadeAlpha>0){ctx.fillStyle='rgba(0,0,0,'+G.fadeAlpha+')';ctx.fillRect(0,0,cv.width,cv.height);}
}

function lighten(hex,amt){try{var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);r=Math.min(255,r+Math.round(amt*255));g=Math.min(255,g+Math.round(amt*255));b=Math.min(255,b+Math.round(amt*255));return'#'+r.toString(16).padStart(2,'0')+g.toString(16).padStart(2,'0')+b.toString(16).padStart(2,'0');}catch(e){return hex;}}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// MOVEMENT & COLLISION
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
var keys={};
document.addEventListener('keydown',function(e){keys[e.code]=true;
  if(e.code==='KeyA'||e.code==='Space')tryEnterBuilding();
  e.preventDefault();
});
document.addEventListener('keyup',function(e){delete keys[e.code];});

function collidesBuilding(nx,ny){
  var pad=10;
  for(var i=0;i<BUILDINGS.length;i++){
    var b=BUILDINGS[i];
    if(nx>b.x-pad&&nx<b.x+b.w+pad&&ny>b.y+b.h*.3&&ny<b.y+b.h+4)return b;
  }
  return null;
}

function tryEnterBuilding(){
  if(G.fading)return;
  for(var i=0;i<BUILDINGS.length;i++){
    var b=BUILDINGS[i];
    if(Math.hypot(player.x-b.door.x,player.y-b.door.y)<55){
      if(b.store&&STORE_DATA[b.id]){enterStore(b.id);return;}
      if(b.id==='town_hall'){showDlg('Town Hall','Welcome to town! Manage your life, shop at stores, and make friends. 🏛️');return;}
      if(b.id.startsWith('house')){showDlg(b.n,'This is a cozy house! The residents keep it tidy. 🏠');return;}
    }
  }
  // Check NPC nearby
  for(var ni=0;ni<NPCS.length;ni++){
    var n=NPCS[ni];
    if(Math.hypot(player.x-n.x,player.y-n.y)<60){showDlg(n.name,n.line);return;}
  }
}

function updatePlayer(){
  if(G.fading||anyPanelOpen())return;
  var spd=player.spd;
  var ddx=0,ddy=0;
  if(keys['ArrowLeft']||keys['KeyA']){ddx=-spd;player.dir='left';}
  if(keys['ArrowRight']||keys['KeyD']){ddx=spd;player.dir='right';}
  if(keys['ArrowUp']||keys['KeyW']){ddy=-spd;player.dir='up';}
  if(keys['ArrowDown']||keys['KeyS']){ddy=spd;player.dir='down';}
  // Joystick
  if(joyDx||joyDy){
    ddx=joyDx*spd;ddy=joyDy*spd;
    if(Math.abs(joyDx)>Math.abs(joyDy))player.dir=joyDx>0?'right':'left';
    else player.dir=joyDy>0?'down':'up';
  }
  // Diagonal normalize
  if(ddx&&ddy){ddx*=.707;ddy*=.707;}
  player.dx=ddx;player.dy=ddy;
  var nx=player.x+ddx,ny=player.y+ddy;
  // River collision (no bridge zones)
  var onBridge=false;[400,950,1550].forEach(function(bx){if(nx>bx&&nx<bx+60)onBridge=true;});
  if(ny>RIVER_Y1-12&&ny<RIVER_Y2+12&&!onBridge){ny=player.y;} // block river crossing
  // Building collision
  if(!collidesBuilding(nx,ny)){player.x=Math.max(20,Math.min(WW-20,nx));player.y=Math.max(80,Math.min(WH-50,ny));}
  else if(!collidesBuilding(nx,player.y)){player.x=Math.max(20,Math.min(WW-20,nx));}
  else if(!collidesBuilding(player.x,ny)){player.y=Math.max(80,Math.min(WH-50,ny));}
  // Camera smooth follow
  var tx=player.x-VW/2,ty=player.y-VH/2;
  cam.x+=(tx-cam.x)*.14;cam.y+=(ty-cam.y)*.14;
  cam.x=Math.max(0,Math.min(WW-VW,cam.x));
  cam.y=Math.max(0,Math.min(WH-VH,cam.y));
}

// NPC roam AI
function updateNPCs(){
  npcTick++;
  NPCS.forEach(function(n,i){
    if(npcTick%(120+i*33)===0){n.dx=(Math.random()-.5)*1.8;n.dy=(Math.random()-.5)*1.8;}
    if(npcTick%(200+i*40)===0){n.dx=0;n.dy=0;}
    var nx2=n.x+n.dx,ny2=n.y+n.dy;
    if(!collidesBuilding(nx2,ny2)&&ny2>280&&ny2<WH-50&&nx2>50&&nx2<WW-50&&!(ny2>RIVER_Y1-10&&ny2<RIVER_Y2+10)){n.x=nx2;n.y=ny2;}
    else{n.dx*=-.8;n.dy*=-.8;}
    if(Math.abs(n.dx)>.05||Math.abs(n.dy)>.05){if(Math.abs(n.dx)>Math.abs(n.dy))n.dir=n.dx>0?'right':'left';else n.dir=n.dy>0?'down':'up';}
  });
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// STORES
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function enterStore(id){
  if(G.fading)return;
  G.fading=true;G.fadeAlpha=0;
  var fade=setInterval(function(){G.fadeAlpha=Math.min(1,G.fadeAlpha+.07);if(G.fadeAlpha>=1){clearInterval(fade);openStorePanel(id);setTimeout(function(){var uf=setInterval(function(){G.fadeAlpha=Math.max(0,G.fadeAlpha-.07);if(G.fadeAlpha<=0){clearInterval(uf);G.fading=false;}},20);},200);}},20);
}

var _storeTab={};
function openStorePanel(id){
  var sd=STORE_DATA[id];if(!sd)return;
  var t=_storeTab[id]||0;
  var el=document.getElementById('store-inner');
  var html='<div style="background:'+sd.col+';color:#fff;border-radius:12px;padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px">';
  html+='<span style="font-size:2rem">'+sd.emoji+'</span><div><div style="font-size:1.05rem;font-weight:900">'+sd.n+'</div><div style="font-size:.7rem;opacity:.8">Tap an item to buy it</div></div>';
  html+='<div style="margin-left:auto;background:rgba(255,255,255,.2);padding:5px 12px;border-radius:16px;font-weight:900">💰 $'+G.money+'</div></div>';
  html+='<div class="tabs">';
  sd.tabs.forEach(function(tb,i){html+='<div class="tab'+(t===i?' on':'')+'" onclick="switchStoreTab(\''+id+'\','+i+')">'+tb+'</div>';});
  html+='</div><div class="sgrid">';
  sd.items.filter(function(it){return it.t===t;}).forEach(function(item){
    var eff=Object.entries(item.eff).map(function(kv){return(kv[1]>0?'+':'')+kv[1]+' '+kv[0];}).join(' ');
    html+='<div class="scard" onclick="buyItem(\''+id+'\',\''+item.n+'\')"><span class="ico">'+item.e+'</span><div class="nm">'+item.n+'</div><div class="pr">'+(item.p>0?'$'+item.p:'FREE')+'</div><div class="ef">'+eff+'</div></div>';
  });
  html+='</div>';
  el.innerHTML=html;openPanel('store-panel');
}
function switchStoreTab(id,t){_storeTab[id]=t;openStorePanel(id);}

var _storeItemMap={};
function buyItem(storeId,itemName){
  var sd=STORE_DATA[storeId];if(!sd)return;
  var item=sd.items.find(function(it){return it.n===itemName;});if(!item)return;
  if(item.p>G.money){toast('Not enough money! 💸');return;}
  G.money-=item.p;G.inventory.push({e:item.e,n:item.n,eff:item.eff,keep:item.keep});
  toast('Got '+item.n+'! 🛍️'+(item.p>0?' (-$'+item.p+')':''));
  updateHUD();openStorePanel(storeId);
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// CHARACTER CREATOR
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function openCreator(){
  var el=document.getElementById('creator-inner');
  var html='<div class="ptitle">✏️ Customize Your Character</div>';
  html+='<div style="display:flex;gap:14px;align-items:flex-start;margin-bottom:14px">';
  html+='<canvas id="cr-prev" width="80" height="100" style="border:2px solid #ddd;border-radius:10px;background:#e8f8e8"></canvas>';
  html+='<div style="flex:1"><label style="font-size:.75rem;font-weight:700;color:#555;display:block;margin-bottom:4px">Name</label>';
  html+='<input id="cr-name" type="text" value="'+player.name+'" placeholder="Your name..." maxlength="12"></div></div>';
  function swatchRow(label,arr,field,isSkin){
    var r='<div style="margin-bottom:10px"><label style="font-size:.72rem;font-weight:700;color:#555;display:block;margin-bottom:5px">'+label+'</label><div class="crow">';
    arr.forEach(function(c,i){r+='<div class="csw'+(player[field]===i?' sel':'')+'" style="background:'+c+'" onclick="setProp(\''+field+'\','+i+')"></div>';});
    return r+'</div></div>';
  }
  function chipRow(label,arr,field){
    var r='<div style="margin-bottom:10px"><label style="font-size:.72rem;font-weight:700;color:#555;display:block;margin-bottom:5px">'+label+'</label><div class="crow">';
    arr.forEach(function(c,i){r+='<div class="cch'+(player[field]===i?' sel':'')+'" onclick="setProp(\''+field+'\','+i+')">'+c+'</div>';});
    return r+'</div></div>';
  }
  html+=swatchRow('Skin Tone',SKINS,'skin',true);
  html+=chipRow('Hair Style',HAIRS,'hair');
  html+=swatchRow('Hair Color',HAIRC,'hairc');
  html+=swatchRow('Eye Color',EYEC,'eyec');
  html+=chipRow('Outfit',OUTFITS.map(function(o){return o.n;}),'outfit');
  html+='<div style="text-align:center;margin-top:8px"><button class="btn" onclick="savePlayer()">✅ Save Look</button></div>';
  el.innerHTML=html;openPanel('creator-panel');

function setProp(field,val){
  player[field]=val;
  var c=document.getElementById('cr-prev');
  if(c)drawChar(c.getContext('2d'),40,90,player,.88,'down',0,false);
  // update chip/swatch highlight
  document.querySelectorAll('.csw').forEach(function(el){el.classList.remove('sel');});
  document.querySelectorAll('.cch').forEach(function(el){el.classList.remove('sel');});
  openCreator();
}

function savePlayer(){
  var nm=(document.getElementById('cr-name').value||'').trim();
  if(nm)player.name=nm;
  toast('Looking good, '+player.name+'! ✨');closePanel('creator-panel');
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// PANELS, HUD, DIALOGUE, TOAST
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function openPanel(id){
  if(id==='creator-panel'){openCreator();return;}
  if(id==='inv-panel'){renderInv();}
  if(id==='chars-panel'){renderChars();}
  document.getElementById(id).classList.add('open');
}
function closePanel(id){document.getElementById(id).classList.remove('open');}
function anyPanelOpen(){return !!document.querySelector('.panel.open');}

function renderInv(){
  var el=document.getElementById('inv-inner');
  el.innerHTML='<div class="ptitle">🎒 Your Bag</div>';
  if(!G.inventory.length){el.innerHTML+='<div style="text-align:center;color:#aaa;padding:20px">Empty! Visit a store to buy items.</div>';return;}
  var g2='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px">';
  G.inventory.forEach(function(item,i){
    g2+='<div style="background:#f8f8f8;border:2px solid #eee;border-radius:8px;padding:8px 4px;text-align:center"><div style="font-size:1.4rem">'+item.e+'</div><div style="font-size:.6rem;color:#555;margin-top:3px">'+item.n+'</div></div>';
  });

function renderChars(){
  var el=document.getElementById('chars-inner');

    html+='<canvas id="npc-mini-'+i+'" width="46" height="60" style="border-radius:6px;background:#e8f8e8"></canvas>';

    NPCS.forEach(function(n,i){var c=document.getElementById('npc-mini-'+i);if(c)drawChar(c.getContext('2d'),23,54,n,.72,'down',0,false);});

function talkNPC(i){closePanel('chars-panel');showDlg(NPCS[i].name,NPCS[i].line);}

function showDlg(name,text){document.getElementById('dlg-name').textContent=name;document.getElementById('dlg-text').textContent=text;document.getElementById('dialogue').style.display='block';}
function closeDlg(){document.getElementById('dialogue').style.display='none';}

var _tt;
function toast(msg){var el=document.getElementById('toast');el.textContent=msg;el.style.opacity='1';clearTimeout(_tt);_tt=setTimeout(function(){el.style.opacity='0';},3000);}

function updateHUD(){
  document.getElementById('hud-money').textContent='💰 $'+G.money;
  var hr=G.hour,ampm=hr<12?'AM':'PM';var h=hr%12||12;
  document.getElementById('hud-day').textContent='Day '+G.day+' '+h+':00 '+(G.hour<6||G.hour>=20?'🌙':'☀️');
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// TOUCH JOYSTICK
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
var joyDx=0,joyDy=0,joyActive=false,joyId=null;
var isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
if(isTouch){
  document.getElementById('joystick-zone').style.display='block';
  document.getElementById('action-btns').style.display='flex';
  var jBase=document.getElementById('joy-base');
  var jKnob=document.getElementById('joy-knob');
  var jRect;
  jBase.addEventListener('touchstart',function(e){e.preventDefault();jRect=jBase.getBoundingClientRect();joyActive=true;joyId=e.changedTouches[0].identifier;},{passive:false});
  document.addEventListener('touchmove',function(e){
    if(!joyActive)return;
    for(var i=0;i<e.changedTouches.length;i++){
      if(e.changedTouches[i].identifier===joyId){
        var t=e.changedTouches[i];
        var dx=t.clientX-(jRect.left+50),dy=t.clientY-(jRect.top+50);
        var dist=Math.sqrt(dx*dx+dy*dy);var max=38;
        if(dist>max){dx=dx/dist*max;dy=dy/dist*max;}
        jKnob.style.left=(28+dx)+'px';jKnob.style.top=(28+dy)+'px';
        joyDx=dx/max;joyDy=dy/max;
        break;
      }
    }
  },{passive:false});
  document.addEventListener('touchend',function(e){
    for(var i=0;i<e.changedTouches.length;i++){if(e.changedTouches[i].identifier===joyId){joyActive=false;joyDx=0;joyDy=0;jKnob.style.left='28px';jKnob.style.top='28px';break;}}
  },{passive:false});
  document.getElementById('abtn-a').addEventListener('touchstart',function(e){e.preventDefault();tryEnterBuilding();},{passive:false});
  document.addEventListener('touchmove',function(e){if(e.target.id!=='joy-base')e.preventDefault();},{passive:false});
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// GAME LOOP
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
var dayTimer=0;
function loop(){
  requestAnimationFrame(loop);
  gameTick++;dayTimer++;
  updatePlayer();updateNPCs();renderWorld();
  // Time progression
  if(dayTimer%1200===0){G.hour=(G.hour+1)%24;if(G.hour===0){G.day++;G.money+=30;toast('Good morning! Day '+G.day+' ☀️  +$30 daily money!');} updateHUD();}
  // Passive money
  if(dayTimer%3000===0){G.money+=Math.floor(5+Math.random()*8);updateHUD();}
}

window.addEventListener('resize',function(){VW=window.innerWidth;VH=window.innerHeight-46;cv.width=VW;cv.height=VH+46;});
updateHUD();loop();
toast('Welcome! Use ARROW KEYS / WASD to walk. Press A to enter buildings! 🏝️');
