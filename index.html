#cv{position:absolute;top:0;left:0;display:block}

.hpill{background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.25);border-radius:20px;padding:4px 12px;color:#fff;font-size:.75rem;font-weight:700;cursor:pointer;white-space:nowrap}
.hpill:active{background:rgba(255,255,255,.3)}
#h-money{color:#ffd700;font-weight:900;font-size:.9rem}
/* ── Mobile controls ── */
#mobile-ctrl{position:fixed;bottom:0;left:0;right:0;height:155px;pointer-events:none;z-index:60}
#joy-wrap{position:absolute;bottom:22px;left:20px;pointer-events:all;touch-action:none}
#joy-base{width:108px;height:108px;border-radius:50%;background:rgba(0,0,0,.3);border:3px solid rgba(255,255,255,.35);position:relative}
#joy-knob{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.55);border:2px solid rgba(255,255,255,.8);position:absolute;top:30px;left:30px;pointer-events:none;transition:top .05s,left .05s}
#action-pad{position:absolute;bottom:20px;right:16px;pointer-events:all;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.abtn{width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:900;color:#fff;cursor:pointer;touch-action:none;border:2px solid rgba(255,255,255,.4)}
#abtn-a{background:rgba(60,180,80,.8)}
#abtn-b{background:rgba(200,40,40,.7);width:48px;height:48px}

.panel{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.3);z-index:80;transform:translateY(100%);transition:transform .38s cubic-bezier(.34,1.3,.64,1);max-height:88dvh;overflow-y:auto}
.panel.open{transform:translateY(0)}
.ph{width:38px;height:4px;background:#ddd;border-radius:2px;margin:12px auto 8px}
.pi{padding:0 16px 30px}
.ptit{font-size:1.05rem;font-weight:900;color:#222;text-align:center;margin-bottom:12px}
.cbtn{position:absolute;top:12px;right:14px;background:#f0f0f0;border:none;border-radius:50%;width:32px;height:32px;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2}
/* ── Screen overlays ── */
.screen{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center}
.screen.on{display:flex}
/* ── Title ── */
#s-title{background:linear-gradient(160deg,#1a1a2e,#16213e,#0f3460)}
/* ── Creator ── */
#s-creator{background:#fff;overflow-y:auto;justify-content:flex-start;padding:20px 0 40px}
.cr-box{width:min(460px,96vw);margin:0 auto}
.crlbl{font-size:.72rem;font-weight:700;color:#555;display:block;margin-bottom:5px;margin-top:10px}
.crrow{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid transparent;cursor:pointer;flex-shrink:0}
.sw.on{border-color:#0053e2;transform:scale(1.18)}
.ch{padding:5px 13px;border-radius:16px;border:2px solid #ddd;font-size:.72rem;cursor:pointer;background:#f8f8f8}
.ch.on{background:#0053e2;color:#fff;border-color:#0053e2}
/* ── Checkout ── */
.ci{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #f0f0f0}

.btn.gr{background:#2a8703}.btn.bl{background:#0053e2}.btn.rd{background:#ea1100}.btn.gd{background:#c89000;color:#fff}.btn.sm{padding:6px 14px;font-size:.75rem;border-radius:8px}

.sc{background:#f8f8f8;border:2px solid #eee;border-radius:10px;padding:8px 5px;text-align:center;cursor:pointer}
.sc:active{background:#e8f0ff;border-color:#0053e2}

.tab.on{background:#0053e2;color:#fff;border-color:#0053e2}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;overflow-x:auto;padding-bottom:3px}

.nb{display:flex;align-items:center;gap:8px;margin:5px 0}
.nbg{flex:1;height:10px;background:#eee;border-radius:5px;overflow:hidden}
.nf{height:100%;border-radius:5px}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// INTERIOR (store rooms)
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
var INT={active:false,bld:null,px:VW/2,py:VH*.75,pdir:'up',frame:0,ftick:0};

function renderInterior(){
  ctx.clearRect(0,0,VW,VH);
  var sd=STORES[INT.bld.id];var bc=INT.bld.col||'#f0f0f0',rc=INT.bld.roof||'#888';
  // Floor tiles
  for(var iy=48;iy<VH-60;iy+=36)for(var ix=0;ix<VW;ix+=36){
    ctx.fillStyle=(Math.floor(ix/36)+Math.floor(iy/36))%2===0?'#f4f0e8':'#e8e4d8';ctx.fillRect(ix,iy,36,36);
    ctx.strokeStyle='rgba(0,0,0,.06)';ctx.lineWidth=.5;ctx.strokeRect(ix,iy,36,36);

  ctx.fillStyle=bc;ctx.fillRect(0,0,VW,72);ctx.fillRect(0,48,18,VH-108);ctx.fillRect(VW-18,48,18,VH-108);

  ctx.fillStyle='rgba(0,0,0,.15)';ctx.fillRect(0,69,VW,3);
  // Brand sign
  ctx.font='bold '+(VW<400?18:22)+'px Arial';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.fillText(sd.emoji+' '+sd.n,VW/2,38);
  // Shelves with items (left wall)

  var cols=Math.floor((VW-60)/90);
  shelfItems.forEach(function(item,i){
    var col2=i%cols,row2=Math.floor(i/cols);
    var sx=28+col2*90,sy=100+row2*115;if(sy+100>VH-70)return;
    // Shelf board
    ctx.fillStyle='#c0a870';ctx.fillRect(sx-4,sy+68,88,8);ctx.fillStyle='#a88850';ctx.fillRect(sx-4,sy+66,88,3);
    // Item display
    var inCart=P.cart.some(function(c){return c.n===item.n;});
    ctx.fillStyle=inCart?'rgba(80,200,80,.25)':'rgba(255,255,255,.65)';ctx.beginPath();ctx.roundRect(sx,sy,80,66,8);ctx.fill();
    ctx.strokeStyle=inCart?'#2a8703':'rgba(0,0,0,.1)';ctx.lineWidth=inCart?2:1;ctx.beginPath();ctx.roundRect(sx,sy,80,66,8);ctx.stroke();
    ctx.font='28px serif';ctx.textAlign='center';ctx.fillText(item.e,sx+40,sy+36);
    ctx.font='bold 9px Arial';ctx.fillStyle='#333';ctx.fillText(item.n,sx+40,sy+50);
    ctx.fillStyle='#2a8703';ctx.fillText(item.p>0?'$'+item.p:'FREE',sx+40,sy+62);
    if(inCart){ctx.font='12px serif';ctx.fillText('✅',sx+68,sy+14);}
  });
  // Teller counter (bottom center)
  var ctrY=VH-100;
  ctx.fillStyle='#8a6840';ctx.beginPath();ctx.roundRect(VW/2-130,ctrY,260,50,8);ctx.fill();
  ctx.fillStyle='#a08050';ctx.beginPath();ctx.roundRect(VW/2-134,ctrY-4,268,12,4);ctx.fill();
  // Cash register
  ctx.fillStyle='#333';ctx.beginPath();ctx.roundRect(VW/2+50,ctrY+8,50,30,5);ctx.fill();ctx.fillStyle='#666';ctx.fillRect(VW/2+55,ctrY+13,16,8);
  ctx.font='14px serif';ctx.fillText('💻',VW/2+60,ctrY+28);
  // Teller NPC (behind counter)
  var telChar={skin:0,hair:0,hairc:2,eyec:0,outfit:INT.bld.id==='walmart'?3:0,name:sd.tel||'Teller'};
  drawChar(ctx,VW/2-70,ctrY-5,telChar,.9,'down',0,false);
  ctx.fillStyle='rgba(0,0,0,.55)';ctx.beginPath();ctx.roundRect(VW/2-90,ctrY-60,52,15,4);ctx.fill();
  ctx.font='bold 9px Arial';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.fillText(sd.tel||'Teller',VW/2-64,ctrY-49);
  ctx.font='14px serif';ctx.fillText('🙂',VW/2-64,ctrY-63);

  var cartTotal=P.cart.reduce(function(s,c){return s+c.p;},0);
  ctx.fillStyle='#2a8703';ctx.beginPath();ctx.roundRect(VW/2+20,ctrY+8,100,34,8);ctx.fill();

  ctx.fillStyle='rgba(0,0,0,.5)';ctx.beginPath();ctx.roundRect(VW/2-50,VH-55,100,30,8);ctx.fill();
  ctx.font='bold 11px Arial';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText('↩ EXIT',VW/2,VH-34);

  if(P.cart.length>0){
    ctx.fillStyle='rgba(42,135,3,.85)';ctx.beginPath();ctx.roundRect(VW-100,48,95,22,6);ctx.fill();
    ctx.font='bold 10px Arial';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText('🛒 '+P.cart.length+' items',VW-52,63);
  }

  sd.tabs.forEach(function(tb,i){

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// INPUT & MOVEMENT
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
var keys={};var joyDx=0,joyDy=0;var G_fade=0,G_fading=false;
var G_day={hour:8,day:1,tick:0};

function anyPanelOpen(){return!!document.querySelector('.panel.open');}

document.addEventListener('keydown',function(e){
  keys[e.code]=true;
  if(e.code==='KeyA'||e.code==='Space'){doAction();e.preventDefault();}
  if(e.code==='KeyB'||e.code==='Escape'){doBack();}
  e.preventDefault();
});
document.addEventListener('keyup',function(e){delete keys[e.code];});

function doAction(){
  if(anyPanelOpen())return;
  if(INT.active){handleInteriorAction();return;}
  // Enter car
  for(var i=0;i<CARS.length;i++){var car=CARS[i];if(!car.driven&&Math.hypot(P.x-car.x,P.y-car.y)<55){enterCar(car);return;}}
  if(P.inCar){exitCar();return;}
  // Enter building
  for(var j=0;j<BUILDINGS.length;j++){var b=BUILDINGS[j];if(Math.hypot(P.x-b.door.x,P.y-b.door.y)<60){enterBuilding(b);return;}}
  // Talk to NPC
  for(var k=0;k<NPCS.length;k++){var n=NPCS[k];if(Math.hypot(P.x-n.x,P.y-n.y)<65){showDlg(n.name,n.line);return;}}
}
function doBack(){if(INT.active){exitInterior();return;}if(P.inCar){exitCar();return;}closeAllPanels();}

function handleInteriorAction(){
  if(anyPanelOpen())return;
  var sd=STORES[INT.bld.id];if(!sd)return;
  // Click zone: checkout button
  // Touch/keyboard A near counter = open checkout
  if(INT.py>VH*.55){openCheckout();return;}
  // Near an item shelf — add nearest item to cart
  var tab=_stab[INT.bld.id]||0;var items=sd.items.filter(function(it){return it.t===tab;});
  var cols=Math.floor((VW-60)/90);
  var closest=null,cdist=70;
  items.forEach(function(item,i){var col2=i%cols,row2=Math.floor(i/cols);var sx=28+col2*90+40,sy=100+row2*115+33;var d=Math.hypot(INT.px-sx,INT.py-sy);if(d<cdist){cdist=d;closest=item;}});
  if(closest){
    var inCart=P.cart.some(function(c){return c.n===closest.n;});
    if(inCart){P.cart=P.cart.filter(function(c){return c.n!==closest.n;});toast('Removed '+closest.n+' from cart');}
    else{P.cart.push(closest);toast('Added '+closest.n+' to cart! 🛒');}
  }
  // Exit zone
  if(INT.py>VH-80){exitInterior();}
}

function updateInteriorMovement(){
  var spd=2.5,dx2=0,dy2=0;
  if(keys['ArrowLeft']||keys['KeyA']){dx2=-spd;}
  if(keys['ArrowRight']||keys['KeyD']){dx2=spd;}
  if(keys['ArrowUp']||keys['KeyW']){dy2=-spd;}
  if(keys['ArrowDown']||keys['KeyS']){dy2=spd;}
  if(joyDx||joyDy){dx2=joyDx*spd;dy2=joyDy*spd;}
  if(dx2&&dy2){dx2*=.707;dy2*=.707;}
  if(Math.abs(dx2)>Math.abs(dy2))INT.pdir=dx2>0?'right':'left';else if(dy2)INT.pdir=dy2>0?'down':'up';
  INT.ftick++;if(INT.ftick%10===0&&(dx2||dy2))INT.frame=(INT.frame+1)%4;
  INT.px=Math.max(28,Math.min(VW-28,INT.px+dx2));INT.py=Math.max(100,Math.min(VH-48,INT.py+dy2));
  // Snap tab switches by position
  if(INT.px<80&&dy2<0&&INT.py<VH-40){/* handled by click/touch */}
}

function updateWorldMovement(){
  var spd=P.inCar?0:P.spd;var ddx=0,ddy=0;
  if(keys['ArrowLeft']||keys['KeyA']){ddx-=P.inCar?0:spd;P.dir='left';}
  if(keys['ArrowRight']||keys['KeyD']){ddx+=P.inCar?0:spd;P.dir='right';}
  if(keys['ArrowUp']||keys['KeyW']){ddy-=P.inCar?0:spd;P.dir='up';}
  if(keys['ArrowDown']||keys['KeyS']){ddy+=P.inCar?0:spd;P.dir='down';}
  if(joyDx||joyDy){ddx=joyDx*(P.inCar?0:spd);ddy=joyDy*(P.inCar?0:spd);if(Math.abs(joyDx)>Math.abs(joyDy))P.dir=joyDx>0?'right':'left';else if(joyDy)P.dir=joyDy>0?'down':'up';}
  if(P.inCar){
    // Driving
    var car=P.inCar;
    if(keys['ArrowUp']||keys['KeyW']||joyDy<-.3)car.spd=Math.min(car.spd+.3,7);
    else if(keys['ArrowDown']||keys['KeyS']||joyDy>.3)car.spd=Math.max(car.spd-.4,-3.5);
    else car.spd*=.92;
    if(keys['ArrowLeft']||keys['KeyA']||joyDx<-.3)car.angle-=.04*(car.spd/7);
    if(keys['ArrowRight']||keys['KeyD']||joyDx>.3)car.angle+=.04*(car.spd/7);
    car.x+=Math.sin(car.angle)*car.spd;car.y-=Math.cos(car.angle)*car.spd;
    car.x=Math.max(60,Math.min(WW-60,car.x));car.y=Math.max(60,Math.min(WH-60,car.y));
    P.x=car.x;P.y=car.y;
  }else{
    if(ddx&&ddy){ddx*=.707;ddy*=.707;}
    var nx=P.x+ddx,ny=P.y+ddy;
    // River block
    var onBridge=false;BRIDGE_XS.forEach(function(bx2){if(nx>bx2&&nx<bx2+60)onBridge=true;});
    if(ny>RIVER_Y-10&&ny<RIVER_Y+RIVER_H+10&&!onBridge)ny=P.y;
    // Building block
    var blocked=false;
    for(var bi=0;bi<BUILDINGS.length;bi++){var b=BUILDINGS[bi];if(nx>b.x-10&&nx<b.x+b.w+10&&ny>b.y-10&&ny<b.y+b.h+10){blocked=true;break;}}
    if(!blocked){P.x=Math.max(30,Math.min(WW-30,nx));P.y=Math.max(60,Math.min(WH-60,ny));}
    P.ftick++;if(P.ftick%10===0&&(ddx||ddy))P.frame=(P.frame+1)%4;
  }
  // Camera smooth follow
  var tx=P.x-VW/2,ty=P.y-VH/2;
  cam.x+=(tx-cam.x)*.14;cam.y+=(ty-cam.y)*.14;
  cam.x=Math.max(0,Math.min(WW-VW,cam.x));cam.y=Math.max(0,Math.min(WH-VH,cam.y));
}

function updateNPCs(){
  NPCS.forEach(function(n,i){
    if(gameTick%(110+i*37)===0){n.dx=(Math.random()-.5)*1.6;n.dy=(Math.random()-.5)*1.6;}
    if(gameTick%(190+i*44)===0){n.dx=0;n.dy=0;}
    var nx2=n.x+n.dx,ny2=n.y+n.dy;
    var ok=true;for(var j=0;j<BUILDINGS.length;j++){var b=BUILDINGS[j];if(nx2>b.x-12&&nx2<b.x+b.w+12&&ny2>b.y-12&&ny2<b.y+b.h+12){ok=false;break;}}
    if(ok&&nx2>50&&nx2<WW-50&&ny2>300&&ny2<WH-50&&!(ny2>RIVER_Y-10&&ny2<RIVER_Y+RIVER_H+10)){n.x=nx2;n.y=ny2;}
    else{n.dx*=-.8;n.dy*=-.8;}
    if(Math.abs(n.dx)>.05||Math.abs(n.dy)>.05){if(Math.abs(n.dx)>Math.abs(n.dy))n.dir=n.dx>0?'right':'left';else n.dir=n.dy>0?'down':'up';}
  });
}

// ── ENTER/EXIT BUILDING ────────────────────────────────────
function enterBuilding(b){
  if(G_fading)return;
  if(!b.store||!STORES[b.id]){showDlg(b.n,'Welcome to '+b.n+'! 🏠');return;}
  P.cart=[];fade(1,function(){INT.active=true;INT.bld=b;INT.px=VW/2;INT.py=VH*.72;INT.pdir='up';fade(0);});
}
function exitInterior(){
  if(G_fading)return;
  fade(1,function(){INT.active=false;INT.bld=null;P.cart=[];fade(0);});
}

// ── CARS ──────────────────────────────────────────────────
function enterCar(car){car.driven=true;P.inCar=car;toast('🚗 Driving! Use controls to steer. A=exit');}
function exitCar(){if(!P.inCar)return;P.inCar.driven=false;P.inCar.spd=0;P.x=P.inCar.x+40;P.y=P.inCar.y+60;P.inCar=null;toast('Exited car!');}

function fade(to,cb){G_fading=true;var step=to>G_fade?.07:-.07;var iv=setInterval(function(){G_fade=Math.round((G_fade+step)*100)/100;if(to===1&&G_fade>=1){G_fade=1;clearInterval(iv);G_fading=false;if(cb)cb();}else if(to===0&&G_fade<=0){G_fade=0;clearInterval(iv);G_fading=false;if(cb)cb();}},20);}

// ── CHECKOUT ──────────────────────────────────────────────
function openCheckout(){
  if(!P.cart.length){toast('Your cart is empty! Pick items from the shelves first 🛒');return;}
  var total=P.cart.reduce(function(s,c){return s+c.p;},0);
  var html='<div class="ptit">🛒 Checkout</div>';
  html+='<div style="background:'+STORES[INT.bld.id].col+';color:#fff;border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:.85rem;font-weight:700">'+STORES[INT.bld.id].emoji+' '+STORES[INT.bld.id].n+' — Teller: '+STORES[INT.bld.id].tel+'</div>';
  P.cart.forEach(function(item){html+='<div class="ci"><span style="font-size:1.3rem">'+item.e+'</span><span style="flex:1;font-size:.82rem;font-weight:700">'+item.n+'</span><span style="color:#2a8703;font-weight:700;font-size:.82rem">$'+item.p+'</span></div>';});
  html+='<div style="margin-top:12px;padding-top:10px;border-top:2px solid #eee;display:flex;justify-content:space-between;align-items:center">';
  html+='<span style="font-size:1rem;font-weight:900">Total: $'+total+'</span>';
  html+='<span style="font-size:.8rem;color:#888">Wallet: $'+P.money+'</span></div>';
  if(total>P.money){html+='<div style="color:#ea1100;font-size:.78rem;margin-top:8px">⚠️ Not enough money! You need $'+(total-P.money)+' more.</div>';}
  html+='<div style="display:flex;gap:10px;margin-top:14px;justify-content:center">';
  if(total<=P.money)html+='<button class="btn gr" onclick="confirmCheckout()">✅ Pay $'+total+'</button>';
  html+='<button class="btn rd sm" onclick="closePanel(\'checkout-panel\')">Cancel</button></div>';
  document.getElementById('checkout-pi').innerHTML=html;openPanel('checkout-panel');
}
function confirmCheckout(){
  var total=P.cart.reduce(function(s,c){return s+c.p;},0);
  if(total>P.money){toast('Not enough money! 💸');return;}
  P.money-=total;
  P.cart.forEach(function(item){
    if(item.eff){if(item.eff.hunger)P.hunger=Math.min(100,P.hunger+(item.eff.hunger||0));if(item.eff.happy)P.happy=Math.min(100,P.happy+(item.eff.happy||0));if(item.eff.energy)P.energy=Math.min(100,P.energy+(item.eff.energy||0));}
    if(item.keep)P.inventory.push({e:item.e,n:item.n});
  });
  var count=P.cart.length;P.cart=[];
  closePanel('checkout-panel');updateHUD();
  toast('Purchased '+count+' items! Thanks for shopping! 🎉');
  showDlg(STORES[INT.bld.id].tel||'Teller','Thank you so much! Have a wonderful day! 😊 Come back soon!');
  setTimeout(function(){exitInterior();},200);
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// PANELS, HUD, DIALOGUE, TOAST
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function openPanel(id){
  if(id==='inv-panel'){renderInv();}
  if(id==='mood-panel'){renderMood();}
  if(id==='creator-panel'){renderCreatorPanel();}
  document.getElementById(id).classList.add('open');
}
function closePanel(id){document.getElementById(id).classList.remove('open');}
function closeAllPanels(){document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('open');});}

function renderInv(){
  var el=document.getElementById('inv-pi');
  el.innerHTML='<div class="ptit">🎒 Your Bag</div>';
  if(!P.inventory.length){el.innerHTML+='<p style="text-align:center;color:#aaa;padding:16px">Empty! Shop at stores to buy items.</p>';return;}
  var g='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:10px">';
  P.inventory.forEach(function(it){g+='<div style="background:#f8f8f8;border:2px solid #eee;border-radius:8px;padding:8px 4px;text-align:center"><div style="font-size:1.4rem">'+it.e+'</div><div style="font-size:.6rem;color:#555;margin-top:3px">'+it.n+'</div></div>';});
  el.innerHTML+=g+'</div>';
}
function renderMood(){
  var el=document.getElementById('mood-pi');
  var avg=Math.round((P.hunger+P.happy+P.energy)/3);
  var html='<div class="ptit">'+getMoodEmoji()+' '+P.name+'\'s Mood</div>';
  html+='<div style="text-align:center;font-size:3rem;margin-bottom:8px">'+getMoodEmoji()+'</div>';
  function nb(ico,label,val,col){return'<div class="nb"><span style="width:22px;text-align:center">'+ico+'</span><div class="nbg"><div class="nf" style="width:'+val+'%;background:'+col+'"></div></div><span style="font-size:.7rem;color:#888;width:30px">'+val+'</span></div>';}
  html+=nb('🍔','Hunger',P.hunger,'#e67e22')+nb('😊','Happy',P.happy,'#e74c3c')+nb('⚡','Energy',P.energy,'#3498db');
  html+='<div style="text-align:center;margin-top:12px;font-size:.8rem;color:#888">Overall: '+avg+'% — '+(avg>80?'Feeling great!':avg>60?'Doing well':avg>40?'Could be better':'Needs attention!')+'</div>';
  html+='<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px">';
  html+='<button class="btn gr sm" onclick="useItem(\'hunger\')">🍎 Eat (+20 hunger)</button>';
  html+='<button class="btn bl sm" onclick="useItem(\'happy\')">🎮 Play (+15 happy)</button>';
  html+='<button class="btn" style="background:#8855cc" onclick="useItem(\'energy\')">💤 Rest (+25 energy)</button>';
  html+='</div>';
  el.innerHTML=html;
}
function useItem(stat){
  if(stat==='hunger')P.hunger=Math.min(100,P.hunger+20);
  if(stat==='happy')P.happy=Math.min(100,P.happy+15);
  if(stat==='energy')P.energy=Math.min(100,P.energy+25);
  renderMood();toast('Feeling better! '+getMoodEmoji());
}
function renderCreatorPanel(){
  var el=document.getElementById('creator-pi');
  var html='<div class="ptit">✏️ Change Your Look</div>';
  html+='<div style="text-align:center;margin-bottom:12px"><canvas id="cr-prev2" width="80" height="104" style="border:2px solid #ddd;border-radius:10px;background:#e8f8e8"></canvas></div>';
  function sw2(label,arr,field){var r='<div style="margin-bottom:10px"><span style="font-size:.72rem;font-weight:700;color:#555;display:block;margin-bottom:5px">'+label+'</span><div class="crrow">';arr.forEach(function(c,i){r+='<div class="sw'+(P[field]===i?' on':'')+'" style="background:'+c+'" onclick="setP(\''+field+'\','+i+')"></div>';});return r+'</div></div>';}
  function ch2(label,arr,field){var r='<div style="margin-bottom:10px"><span style="font-size:.72rem;font-weight:700;color:#555;display:block;margin-bottom:5px">'+label+'</span><div class="crrow">';arr.forEach(function(c,i){r+='<div class="ch'+(P[field]===i?' on':'')+'" onclick="setP(\''+field+'\','+i+')">'+(typeof c==='object'?c.n:c)+'</div>';});return r+'</div></div>';}
  html+=sw2('Skin Tone',SKINS,'skin')+ch2('Hair',HAIRS,'hair')+sw2('Hair Color',HAIRC,'hairc')+sw2('Eye Color',EYEC,'eyec')+ch2('Outfit',OUTF,'outfit');
  el.innerHTML=html;
  setTimeout(function(){var c2=document.getElementById('cr-prev2');if(c2)drawChar(c2.getContext('2d'),40,94,P,1,'down',0,false);},30);
}
function setP(field,val){P[field]=val;renderCreatorPanel();}

var _tt;
function toast(msg){var el=document.getElementById('toast');el.textContent=msg;el.style.opacity='1';clearTimeout(_tt);_tt=setTimeout(function(){el.style.opacity='0';},3000);}
function showDlg(name,text){document.getElementById('dlg-name').textContent=name;document.getElementById('dlg-text').textContent=text;document.getElementById('dlg').style.display='block';}
function closeDlg(){document.getElementById('dlg').style.display='none';}
function updateHUD(){
  document.getElementById('h-money').textContent='💰 $'+P.money;
  var h=G_day.hour%12||12,ap=G_day.hour<12?'AM':'PM';
  document.getElementById('h-day').textContent='Day '+G_day.day+' '+h+ap+(G_day.hour<6||G_day.hour>=20?' 🌙':' ☀️');
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// TOUCH CONTROLS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function initTouch(){
  document.getElementById('mobile-ctrl').style.display='block';
  var jBase=document.getElementById('joy-base'),jKnob=document.getElementById('joy-knob');
  var jRect,jId=null;
  jBase.addEventListener('touchstart',function(e){e.preventDefault();jRect=jBase.getBoundingClientRect();jId=e.changedTouches[0].identifier;},{passive:false});
  document.addEventListener('touchmove',function(e){
    if(jId===null)return;
    for(var i=0;i<e.changedTouches.length;i++){
      if(e.changedTouches[i].identifier===jId){
        var t=e.changedTouches[i],dx=t.clientX-(jRect.left+54),dy=t.clientY-(jRect.top+54),dist=Math.sqrt(dx*dx+dy*dy),max=40;
        if(dist>max){dx=dx/dist*max;dy=dy/dist*max;}
        jKnob.style.left=(30+dx)+'px';jKnob.style.top=(30+dy)+'px';
        joyDx=dx/max;joyDy=dy/max;break;
      }
    }
  },{passive:false});
  document.addEventListener('touchend',function(e){for(var i=0;i<e.changedTouches.length;i++){if(e.changedTouches[i].identifier===jId){jId=null;joyDx=0;joyDy=0;jKnob.style.left='30px';jKnob.style.top='30px';break;}}},{passive:false});
  document.getElementById('abtn-a').addEventListener('touchstart',function(e){e.preventDefault();doAction();},{passive:false});
  document.getElementById('abtn-b').addEventListener('touchstart',function(e){e.preventDefault();doBack();},{passive:false});
  // Interior tap to select items / tabs
  cv.addEventListener('touchstart',function(e){
    if(!INT.active)return;
    var t=e.changedTouches[0];handleInteriorTap(t.clientX,t.clientY);
  },{passive:false});
}

function handleInteriorTap(tapX,tapY){
  var sd=STORES[INT.bld.id];if(!sd)return;
  // Check tabs
  var tabX=10;var tabs=sd.tabs;
  for(var ti=0;ti<tabs.length;ti++){
    var tw=tabs[ti].length*6+28;
    if(tapX>tabX&&tapX<tabX+tw&&tapY>VH-58&&tapY<VH-30){_stab[INT.bld.id]=ti;return;}
    tabX+=tw;
  }
  // Checkout button
  if(tapX>VW/2+20&&tapX<VW/2+120&&tapY>window.innerHeight-100&&tapY<window.innerHeight-66){openCheckout();return;}
  // Exit
  if(tapY>VH-55&&tapX>VW/2-50&&tapX<VW/2+50){exitInterior();return;}
  // Item tap
  var tab=_stab[INT.bld.id]||0;var items=sd.items.filter(function(it){return it.t===tab;});
  var cols=Math.floor((VW-60)/90);
  items.forEach(function(item,i){
    var col2=i%cols,row2=Math.floor(i/cols);var sx=28+col2*90,sy=100+row2*115;
    if(tapX>sx&&tapX<sx+80&&tapY>sy&&tapY<sy+74){
      var inCart=P.cart.some(function(c){return c.n===item.n;});
      if(inCart){P.cart=P.cart.filter(function(c){return c.n!==item.n;});toast('Removed '+item.n);}
      else{P.cart.push(item);toast(item.n+' added to cart 🛒');}
    }
  });
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// GAME START & LOOP
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
buildCreatorUI(); // build creator on load

function startGame(){
  document.getElementById('hud').style.display='flex';
  if(isMobile)initTouch();
  updateHUD();
  toast('Welcome '+P.name+'! Walk around and explore. Press A to interact! 🏝️');
  loop();
}

function loop(){
  requestAnimationFrame(loop);
  gameTick++;
  // Day clock
  G_day.tick++;
  if(G_day.tick%1500===0){G_day.hour=(G_day.hour+1)%24;if(G_day.hour===0){G_day.day++;P.money+=30;toast('Morning! Day '+G_day.day+' ☀️ +$30');} updateHUD();}
  if(G_day.tick%4000===0){P.money+=Math.floor(5+Math.random()*8);updateHUD();}
  if(G_day.tick%800===0){P.hunger=Math.max(0,P.hunger-2);P.happy=Math.max(0,P.happy-1);P.energy=Math.max(0,P.energy-1);}
  if(!anyPanelOpen()&&!G_fading){
    if(INT.active)updateInteriorMovement();else{updateWorldMovement();updateNPCs();}
  }
  if(INT.active)renderInterior();else renderWorld();
}
window.addEventListener('resize',function(){VW=innerWidth;VH=innerHeight;cv.width=VW;cv.height=VH;});
