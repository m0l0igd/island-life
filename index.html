<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Island Life</title>
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#222;font-family:'Segoe UI',Arial,sans-serif}
canvas{display:block;position:absolute;top:0;left:0}
input,textarea,select{touch-action:auto;pointer-events:all}
#hud{position:fixed;top:0;left:0;right:0;height:46px;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);display:flex;align-items:center;padding:0 10px;gap:8px;z-index:50;pointer-events:none}
#hud *{pointer-events:all}
.hp{background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.25);border-radius:18px;padding:4px 11px;color:#fff;font-size:.72rem;font-weight:700;cursor:pointer;white-space:nowrap}
.hp:active{background:rgba(255,255,255,.3)}
#hmoney{color:#ffd700;font-weight:900;font-size:.88rem}
.screen{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;background:#1a1a2e;overflow-y:auto}
.screen.on{display:flex}
#s-creator{background:linear-gradient(160deg,#e8f5e8,#f0faf0);padding:20px 0 40px}
.cr-box{width:min(450px,96vw);margin:0 auto;padding:0 12px}
.crlbl{font-size:.72rem;font-weight:700;color:#2a6a2a;display:block;margin:10px 0 5px}
.crrow{display:flex;flex-wrap:wrap;gap:7px}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.sw.on{border-color:#0053e2;transform:scale(1.18)}
.ch{padding:5px 12px;border-radius:14px;border:2px solid #ccc;font-size:.7rem;cursor:pointer;background:#f0f0f0;color:#333}
.ch.on{background:#2a7a2a;color:#fff;border-color:#2a7a2a}
#cr-name{width:100%;border:2px solid #bdb;border-radius:8px;padding:9px;font-size:.95rem;outline:none;background:#fff;color:#222}
#cr-name:focus{border-color:#2a7a2a}
.panel{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.3);z-index:80;transform:translateY(100%);transition:transform .35s cubic-bezier(.34,1.3,.64,1);max-height:88svh;overflow-y:auto}
.panel.open{transform:translateY(0)}
.ph{width:36px;height:4px;background:#ddd;border-radius:2px;margin:12px auto 8px}
.pi{padding:0 16px 30px}
.ptit{font-size:1.05rem;font-weight:900;color:#222;text-align:center;margin-bottom:12px}
.xb{position:absolute;top:12px;right:14px;background:#f0f0f0;border:none;border-radius:50%;width:32px;height:32px;font-size:1.1rem;cursor:pointer}
.btn{border:none;border-radius:10px;padding:10px 22px;font-size:.88rem;font-weight:700;cursor:pointer;color:#fff}
.btn.gr{background:#2a8703}.btn.bl{background:#0053e2}.btn.rd{background:#ea1100}
.btn.gd{background:#c89000}.btn.sm{padding:6px 14px;font-size:.75rem;border-radius:8px}
.nb{display:flex;align-items:center;gap:8px;margin:5px 0}
.nbg{flex:1;height:10px;background:#eee;border-radius:5px;overflow:hidden}
.nf{height:100%;border-radius:5px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:9px;margin-top:10px}
.sc{background:#f8f8f8;border:2px solid #eee;border-radius:10px;padding:8px 5px;text-align:center;cursor:pointer;transition:border-color .1s}
.sc.inCart{border-color:#2a8703;background:#f0fff0}
.sc:active{background:#e8f0ff}
.sc .ico{font-size:1.6rem}.sc .nm{font-size:.6rem;font-weight:700;color:#333;margin:3px 0 2px}.sc .pr{font-size:.63rem;color:#2a8703;font-weight:700}
.tab{padding:5px 12px;border-radius:12px;border:2px solid #ddd;font-size:.7rem;font-weight:700;cursor:pointer;background:#f0f0f0;color:#555;white-space:nowrap}
.tab.on{background:#0053e2;color:#fff;border-color:#0053e2}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;overflow-x:auto;padding-bottom:3px}
#ctrl{position:fixed;bottom:0;left:0;right:0;height:150px;pointer-events:none;z-index:60;display:none}
#jw{position:absolute;bottom:20px;left:18px;pointer-events:all;touch-action:none}
#jb{width:104px;height:104px;border-radius:50%;background:rgba(0,0,0,.28);border:3px solid rgba(255,255,255,.3);position:relative}
#jk{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.55);border:2px solid rgba(255,255,255,.8);position:absolute;top:29px;left:29px;pointer-events:none}
#ap{position:absolute;bottom:20px;right:16px;pointer-events:all;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.ab{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.82rem;font-weight:900;color:#fff;cursor:pointer;touch-action:none;border:2px solid rgba(255,255,255,.4);flex-direction:column}
#ab-a{background:rgba(50,170,70,.82)}
#ab-b{background:rgba(200,40,40,.72);width:46px;height:46px;font-size:.72rem}
#toast{position:fixed;top:56px;left:50%;transform:translateX(-50%);background:rgba(10,60,10,.9);color:#fff;padding:8px 20px;border-radius:20px;font-size:.8rem;font-weight:700;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;max-width:90vw;text-align:center}
#dlg{position:fixed;bottom:170px;left:10px;right:10px;background:rgba(10,35,10,.95);border:2px solid #5dbb63;border-radius:14px;color:#fff;padding:12px 14px 10px;z-index:90;display:none}
#dlg .dn{font-weight:900;color:#ffd700;font-size:.85rem;margin-bottom:3px}
#dlg .dt{font-size:.82rem;line-height:1.5}
#dlg .dok{float:right;background:#5dbb63;border:none;border-radius:8px;color:#fff;padding:4px 16px;font-size:.78rem;font-weight:700;cursor:pointer;margin-top:6px}
</style></head><body>
<canvas id="cv"></canvas>
<div id="hud" style="display:none">
  <span id="hmoney">💰 $80</span>
  <span class="hp" id="hday">Day 1 ☀️</span>
  <span class="hp" onclick="openPanel('inv-panel')">🎒 Bag</span>
  <span class="hp" onclick="openPanel('mood-panel')">😊 Mood</span>
  <span class="hp" onclick="openPanel('creator-panel');renderCreatorPanel()">✏️ Look</span>
</div>
<div class="screen on" id="s-title">
  <div style="text-align:center;padding:24px">
    <div style="font-size:5rem;margin-bottom:8px;filter:drop-shadow(0 4px 20px rgba(255,200,0,.6))">🏝️</div>
    <div style="font-size:2.8rem;font-weight:900;color:#ffd700;text-shadow:2px 2px 12px rgba(0,0,0,.8);letter-spacing:2px">ISLAND LIFE</div>

      <button class="btn gr" style="font-size:1rem;padding:14px 40px;border-radius:14px" onclick="showScreen('s-creator');buildCreatorUI()">▶ New Game</button>

</div>

  <div class="cr-box">
    <div style="font-size:1.25rem;font-weight:900;color:#2a7a2a;text-align:center;margin-bottom:14px">✏️ Create Your Character</div>
    <div style="display:flex;gap:14px;align-items:center;margin-bottom:14px">
      <canvas id="crprev" width="88" height="115" style="border:2px solid #bdb;border-radius:12px;background:#e8f8e8;flex-shrink:0"></canvas>

        <label class="crlbl" for="cr-name">Your Name</label>

<div class="panel" id="store-panel"><button class="xb" onclick="closePanel('store-panel')">✕</button><div class="ph"></div><div class="pi" id="store-pi"></div></div>
<div class="panel" id="checkout-panel"><button class="xb" onclick="closePanel('checkout-panel')">✕</button><div class="ph"></div><div class="pi" id="checkout-pi"></div></div>
<div class="panel" id="inv-panel"><button class="xb" onclick="closePanel('inv-panel')">✕</button><div class="ph"></div><div class="pi" id="inv-pi"></div></div>
<div class="panel" id="mood-panel"><button class="xb" onclick="closePanel('mood-panel')">✕</button><div class="ph"></div><div class="pi" id="mood-pi"></div></div>
<div class="panel" id="creator-panel"><button class="xb" onclick="closePanel('creator-panel')">✕</button><div class="ph"></div><div class="pi" id="creator-pi"></div></div>
<div id="ctrl">
  <div id="jw"><div id="jb"><div id="jk"></div></div></div>
  <div id="ap">
    <div class="ab" id="ab-a">A<span style="font-size:.5rem;opacity:.8">ENTER</span></div>

  </div>
</div>
<div id="dlg"><div class="dn" id="dlg-n"></div><div class="dt" id="dlg-t"></div><button class="dok" onclick="closeDlg()">OK ▶</button></div>
<div id="toast"></div>
<script>
// Island Life - Part 1: World Data & Rendering (FIXED)
'use strict';

// ── POLYFILL ────────────────────────────────────────────────────────────────
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    r=Math.min(+r||0,w/2,h/2);this.beginPath();
    this.moveTo(x+r,y);this.lineTo(x+w-r,y);this.arcTo(x+w,y,x+w,y+r,r);
    this.lineTo(x+w,y+h-r);this.arcTo(x+w,y+h,x+w-r,y+h,r);
    this.lineTo(x+r,y+h);this.arcTo(x,y+h,x,y+h-r,r);
    this.lineTo(x,y+r);this.arcTo(x,y,x+r,y,r);this.closePath();return this;
  };
}

// ── WORLD DIMENSIONS ────────────────────────────────────────────────────────
var WW=2600, WH=1900;

// ── ROAD / ZONE Y COORDINATES ───────────────────────────────────────────────
// Sky decorative only: Y 0-90 (nothing spawns here)
// North park area:     Y 90-300
// North buildings:     Y 300-440  (museum, library end at ≤440)
// North road:          Y 450-510
// North sidewalk:      Y 510-530
// Store buildings:     Y 530-800  (bottoms at ≤800)
// South sidewalk:      Y 800-820
// Parking lot:         Y 820-940
// Main road:           Y 960-1030
// River:               Y 1060-1150
// South road:          Y 1170-1230
// Residential houses:  Y 1240-1390
// South park:          Y 1420+

var ROAD_N_Y=450, ROAD_N_H=60;
var ROAD_S_Y=960, ROAD_S_H=70;
var RIVER_Y=1060, RIVER_H=90;
var ROAD_SS_Y=1170, ROAD_SS_H=55;
var PARK_LOT_Y=820;
var BRIDGE_XS=[300,900,1600];

// ── BUILDINGS ───────────────────────────────────────────────────────────────
var BLDS=[
  // Commercial row  (y 530–800, bottoms ≤ 800 so clear of parking lot at 820)
  {id:'walmart',  n:'Walmart',   x:100, y:534,w:320,h:264, col:'#c8d8f0',roof:'#0053e2',sc:'#0053e2',st:'#ffc220',sign:'★ WALMART',   e:'🏪',store:true},
  {id:'mcdonalds',n:"McDonald's",x:500, y:548,w:254,h:250, col:'#fff3cc',roof:'#da291c',sc:'#da291c',st:'#f6c217',sign:"McDONALD'S",  e:'🍔',store:true},
  {id:'target',   n:'Target',    x:830, y:540,w:264,h:258, col:'#ffe8e8',roof:'#cc0000',sc:'#cc0000',st:'#fff',   sign:'◎ TARGET',    e:'🎯',store:true},
  {id:'gamestop', n:'GameStop',  x:1170,y:554,w:240,h:244, col:'#e0f0e0',roof:'#1a6b1a',sc:'#1a6b1a',st:'#fff',  sign:'GAMESTOP',    e:'🎮',store:true},
  {id:'starbucks',n:'Starbucks', x:1488,y:558,w:214,h:240, col:'#d0f0e4',roof:'#00704a',sc:'#00704a',st:'#fff',  sign:'STARBUCKS',   e:'☕',store:true},
  {id:'park',     n:'City Park', x:1778,y:540,w:254,h:258, col:'#c8f0b8',roof:'#2a8703',sc:'#2a8703',st:'#fff',  sign:'🌳 CITY PARK',e:'🌳',store:true},

  // North row — y 304–440  (bottom ≤ 440, road starts at 450 ✓)
  {id:'museum',   n:'Museum',    x:340, y:304,w:268,h:134, col:'#f0e8d0',roof:'#886644',sc:'#886644',st:'#fff',  sign:'MUSEUM',      e:'🏛️'},
  {id:'library',  n:'Library',   x:700, y:310,w:224,h:128, col:'#e8f0f8',roof:'#446688',sc:'#446688',st:'#fff',  sign:'LIBRARY',     e:'📚'},
  {id:'townhall', n:'Town Hall', x:1060,y:300,w:244,h:138, col:'#f5e8c8',roof:'#cc3300',sc:'#cc3300',st:'#fff',  sign:'TOWN HALL',   e:'🏛️'},

  // Houses (Y 1240–1390)
  {id:'house0',n:'Your House',x:100, y:1242,w:170,h:146,house:true,htype:0},
  {id:'house1',n:'Ranch Home',x:360, y:1250,w:200,h:136,house:true,htype:1},
  {id:'house2',n:'Victorian',  x:640, y:1234,w:162,h:164,house:true,htype:2},
  {id:'house3',n:'Modern',     x:882, y:1246,w:184,h:150,house:true,htype:3},
  {id:'house4',n:'Craftsman',  x:1134,y:1242,w:174,h:146,house:true,htype:4},
  {id:'house5',n:'Cottage',    x:1382,y:1252,w:164,h:138,house:true,htype:5},
];

// ── CARS ────────────────────────────────────────────────────────────────────
// Types: 0=sedan 1=SUV 2=pickup 3=sports 4=van
var CARS=[
  {x:380, y:895,angle:0,spd:0,col:'#cc2020',col2:'#881010',type:0,driven:false},
  {x:560, y:885,angle:0,spd:0,col:'#2044c8',col2:'#102080',type:1,driven:false},
  {x:740, y:895,angle:0,spd:0,col:'#1a7030',col2:'#0e4018',type:2,driven:false},
  {x:920, y:888,angle:0,spd:0,col:'#b8b010',col2:'#787008',type:3,driven:false},
  {x:1100,y:895,angle:0,spd:0,col:'#b85020',col2:'#782810',type:4,driven:false},
];

// ── SEEDED RNG ───────────────────────────────────────────────────────────────
var _s3=17;
function rnd3(){_s3=(_s3*1664525+1013904223)|0;return((_s3>>>0)/4294967295);}
function ri3(a,b){return Math.floor(rnd3()*(b-a)+a);}

// ── DECORATION ───────────────────────────────────────────────────────────────
var TREES=[], FLOWERS=[];

function bldRect(x,y,pad){
  for(var i=0;i<BLDS.length;i++){
    var b=BLDS[i];
    if(x>b.x-pad&&x<b.x+b.w+pad&&y>b.y-pad&&y<b.y+b.h+pad)return true;
  }
  return false;
}
function inRoad(y){
  return (y>ROAD_N_Y-15&&y<ROAD_N_Y+ROAD_N_H+15)
      || (y>ROAD_S_Y-15&&y<ROAD_S_Y+ROAD_S_H+15)
      || (y>RIVER_Y-15&&y<RIVER_Y+RIVER_H+15)
      || (y>ROAD_SS_Y-15&&y<ROAD_SS_Y+ROAD_SS_H+15)
      || (y>PARK_LOT_Y-5&&y<PARK_LOT_Y+125);
}

// ── North park trees (Y 100–290) — well below sky strip end at Y~90 ──────────
// Sky strip in renderWorld is ONLY at Y 0–90.  Trees at Y>90 sit on GRASS. ✓
for(var _t=0;_t<60;_t++){
  var _ty=100+rnd3()*180;               // 100–280 — grass zone ✓
  var _tx=40+rnd3()*(WW-80);
  if(!bldRect(_tx,_ty,45)&&!inRoad(_ty))
    TREES.push({x:_tx,y:_ty,r:18+rnd3()*14,c:rnd3()<.3?'#3aaa3a':'#2a8a2a'});
}
// South park trees (Y 1430–1800)
for(var _t2=0;_t2<70;_t2++){
  var _ty2=1430+rnd3()*360;
  var _tx2=40+rnd3()*(WW-80);
  if(!bldRect(_tx2,_ty2,40)&&!inRoad(_ty2))
    TREES.push({x:_tx2,y:_ty2,r:18+rnd3()*14,c:rnd3()<.3?'#3aaa3a':'#2a8a2a'});
}
// Street trees along north-side of commercial strip (just above stores)
for(var _st=0;_st<22;_st++){
  TREES.push({x:120+_st*110+rnd3()*30,y:527,r:13,c:'#2a8a2a'});
}

// Flowers — avoid sky zone (Y<95) and roads
for(var _f=0;_f<180;_f++){
  var _fy; var _fx=40+rnd3()*(WW-80);
  if(rnd3()<.35) _fy=100+rnd3()*190;        // north park
  else           _fy=1250+rnd3()*580;       // residential/south park
  if(!bldRect(_fx,_fy,18)&&!inRoad(_fy))
    FLOWERS.push({x:_fx,y:_fy,e:['🌸','🌼','🌺','🌻','🌷'][ri3(0,5)]});
}
// Garden flowers around houses
BLDS.filter(function(b){return b.house;}).forEach(function(b){
  for(var i=0;i<8;i++)
    FLOWERS.push({x:b.x+rnd3()*b.w,y:b.y+b.h+5+rnd3()*22,e:['🌸','🌼','🌷'][ri3(0,3)]});
});

// ── HELPERS ─────────────────────────────────────────────────────────────────
function wx(x){return x-CAM.x;}
function wy(y){return y-CAM.y;}

function lighten(hex,a){
  try{
    var r=Math.min(255,parseInt(hex.slice(1,3),16)+Math.round(a*255));
    var g2=Math.min(255,parseInt(hex.slice(3,5),16)+Math.round(a*255));
    var b2=Math.min(255,parseInt(hex.slice(5,7),16)+Math.round(a*255));
    return'#'+r.toString(16).padStart(2,'0')+g2.toString(16).padStart(2,'0')+b2.toString(16).padStart(2,'0');
  }catch(e){return hex;}
}

// ── WORLD RENDERER ──────────────────────────────────────────────────────────
function renderWorld(ctx,VW,VH,GT){
  ctx.clearRect(0,0,VW,VH);

  // ── Base: full grass background ─────────────────────────────
  // (sky strip is TINY — only world Y 0-90, just for sun/clouds)
  ctx.fillStyle='#5dbb63';ctx.fillRect(0,0,VW,VH);

  // ── Tiny sky strip at top of world map (Y 0-90 only) ────────
  var skyBot=wy(90);
  if(skyBot>0){
    var sg=ctx.createLinearGradient(0,0,0,Math.min(skyBot,VH));
    sg.addColorStop(0,'#5ab0f0');sg.addColorStop(1,'#88c8f0');
    ctx.fillStyle=sg;ctx.fillRect(0,0,VW,Math.min(skyBot,VH));
    // Sun (world-space position)
    var sunSX=wx(WW*0.82),sunSY=wy(40);
    if(sunSX>-50&&sunSX<VW+50&&sunSY>-50&&sunSY<VH+50){
      var sunG=ctx.createRadialGradient(sunSX,sunSY,0,sunSX,sunSY,36);
      sunG.addColorStop(0,'#fff7a0');sunG.addColorStop(.5,'#ffe040');sunG.addColorStop(1,'rgba(255,200,0,0)');
      ctx.fillStyle=sunG;ctx.beginPath();ctx.arc(sunSX,sunSY,36,0,Math.PI*2);ctx.fill();
    }
  }

  // ── North park (grass tint Y 90-295) ─────────────────────────
  var npTop=wy(90),npBot=wy(295);
  if(npBot>0&&npTop<VH){
    ctx.fillStyle='rgba(80,180,80,.22)';
    ctx.fillRect(0,Math.max(0,npTop),VW,Math.min(npBot,VH)-Math.max(0,npTop));
  }
  // Fountain in north park
  var fcx=wx(500),fcy=wy(200);
  if(fcx>-60&&fcx<VW+60&&fcy>-40&&fcy<VH+40){
    ctx.fillStyle='#9ad4f0';ctx.beginPath();ctx.arc(fcx,fcy,32,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#60b0d8';ctx.beginPath();ctx.arc(fcx,fcy,22,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.7)';ctx.beginPath();ctx.arc(fcx,fcy,5,0,Math.PI*2);ctx.fill();
    // Water sprays
    for(var fi=0;fi<6;fi++){
      var fa=fi/6*Math.PI*2+GT*.06;
      ctx.globalAlpha=.55;ctx.fillStyle='#a8e0ff';
      ctx.beginPath();ctx.arc(fcx+Math.cos(fa)*10,fcy+Math.sin(fa)*10-5,2.5,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
    ctx.strokeStyle='#60b0d8';ctx.lineWidth=4;ctx.beginPath();ctx.arc(fcx,fcy,32,0,Math.PI*2);ctx.stroke();
  }

  // ── Clouds (float in sky band, parallax) ─────────────────────
  var clouds=[[0.2,55,.8],[0.5,30,.5],[0.76,62,.9]];
  clouds.forEach(function(c,ci){
    var clx=(wx(WW*c[0])%VW+VW+GT*c[2]*.22)%VW;
    var cly=wy(c[1]);
    if(cly>-30&&cly<skyBot+20){
      ctx.globalAlpha=.82;
      [[0,0,46,16],[26,-10,36,24],[52,-4,38,18]].forEach(function(r){
        ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();ctx.roundRect(clx+r[0],cly+r[1],r[2],r[3],14);ctx.fill();
      });
      ctx.globalAlpha=1;
    }
  });

  // ── Parking lot ──────────────────────────────────────────────
  var ply=wy(PARK_LOT_Y),plH=130;
  if(ply<VH&&ply+plH>0){
    ctx.fillStyle='#6a6a6a';ctx.fillRect(0,ply,VW,plH);
    ctx.fillStyle='#737373';ctx.fillRect(0,ply,VW,4);ctx.fillRect(0,ply+plH-4,VW,4);
    ctx.setLineDash([12,10]);ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=1.5;
    for(var ps=0;ps<WW;ps+=52){
      var psx=wx(ps);
      if(psx<-5||psx>VW+5)continue;
      ctx.beginPath();ctx.moveTo(psx,ply+6);ctx.lineTo(psx,ply+plH-6);ctx.stroke();
    }
    ctx.setLineDash([]);
  }

  // ── Roads ────────────────────────────────────────────────────
  [[ROAD_N_Y,ROAD_N_H,'#484848'],[ROAD_S_Y,ROAD_S_H,'#484848'],[ROAD_SS_Y,ROAD_SS_H,'#505050']].forEach(function(rd){
    var ry=wy(rd[0]),rh=rd[1];if(ry>VH||ry+rh<0)return;
    ctx.fillStyle=rd[2];ctx.fillRect(0,ry,VW,rh);
    // Road edges
    ctx.fillStyle='rgba(255,255,255,.5)';ctx.fillRect(0,ry+1,VW,3);ctx.fillRect(0,ry+rh-4,VW,3);
    // Centre dashes
    ctx.setLineDash([22,16]);ctx.strokeStyle='rgba(255,200,0,.7)';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(0,ry+rh/2);ctx.lineTo(VW,ry+rh/2);ctx.stroke();ctx.setLineDash([]);
  });

  // ── Sidewalks ────────────────────────────────────────────────
  [[ROAD_N_Y+ROAD_N_H,16],[ROAD_S_Y+ROAD_S_H,20],[ROAD_SS_Y+ROAD_SS_H,14]].forEach(function(sw){
    var swy=wy(sw[0]);if(swy>VH||swy+sw[1]<0)return;
    ctx.fillStyle='#c8c0b2';ctx.fillRect(0,swy,VW,sw[1]);
  });
  // Sidewalk ABOVE stores
  var swAbove=wy(PARK_LOT_Y-16);if(swAbove<VH&&swAbove+16>0){ctx.fillStyle='#c8c0b2';ctx.fillRect(0,swAbove,VW,16);}

  // ── River ────────────────────────────────────────────────────
  var rv1=wy(RIVER_Y),rv2=wy(RIVER_Y+RIVER_H);
  if(rv1<VH&&rv2>0){
    var rg=ctx.createLinearGradient(0,rv1,0,rv2);
    rg.addColorStop(0,'#3898e8');rg.addColorStop(1,'#1a70c8');
    ctx.fillStyle=rg;ctx.fillRect(0,rv1,VW,rv2-rv1);
    // Ripples
    ctx.globalAlpha=.3;ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=1.5;
    for(var ri2=0;ri2<4;ri2++){
      ctx.beginPath();
      for(var rx2=0;rx2<VW;rx2+=12)
        ctx.lineTo(rx2,rv1+(rv2-rv1)/2+Math.sin((rx2+GT*1.4+ri2*42)*.05)*7);
      ctx.stroke();
    }
    ctx.globalAlpha=1;
    ctx.fillStyle='#8a7050';ctx.fillRect(0,rv1-4,VW,5);ctx.fillRect(0,rv2-1,VW,5);
    // Bridges
    BRIDGE_XS.forEach(function(bx){
      var bsx=wx(bx);
      ctx.fillStyle='#b09870';ctx.fillRect(bsx,rv1-4,64,rv2-rv1+8);
      ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(bsx,rv1-4,64,4);
      ctx.strokeStyle='#907850';ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(bsx-2,rv1-4);ctx.lineTo(bsx-2,rv2+4);ctx.stroke();
      ctx.beginPath();ctx.moveTo(bsx+66,rv1-4);ctx.lineTo(bsx+66,rv2+4);ctx.stroke();
      for(var bp=4;bp<60;bp+=14){
        ctx.fillStyle='#c0a880';ctx.fillRect(bsx+bp,rv1-6,10,5);ctx.fillRect(bsx+bp,rv2+1,10,5);
      }
    });
  }

  // ── Flowers ──────────────────────────────────────────────────
  FLOWERS.forEach(function(f){
    var fx2=wx(f.x),fy2=wy(f.y);
    if(fx2<-14||fx2>VW+14||fy2<-14||fy2>VH+14)return;
    ctx.font='12px serif';ctx.textAlign='center';ctx.fillText(f.e,fx2,fy2);
  });

  // ── Trees (sorted by Y for depth) ────────────────────────────
  TREES.slice().sort(function(a,b){return a.y-b.y;}).forEach(function(t){
    var tx=wx(t.x),ty=wy(t.y);
    if(tx<-70||tx>VW+70||ty<-70||ty>VH+90)return;
    // Shadow
    ctx.globalAlpha=.18;ctx.fillStyle='#000';
    ctx.beginPath();ctx.ellipse(tx,ty+t.r*.25,t.r*.56,t.r*.18,0,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
    // Trunk
    ctx.fillStyle='#6a4020';ctx.fillRect(tx-5,ty-t.r*.28,10,t.r*.5);
    // Three canopy layers for depth
    ctx.fillStyle='#1a6a18';ctx.beginPath();ctx.arc(tx,ty-t.r*.45,t.r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=t.c;
    ctx.beginPath();ctx.arc(tx-t.r*.28,ty-t.r*.4,t.r*.74,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(tx+t.r*.24,ty-t.r*.34,t.r*.7,0,Math.PI*2);ctx.fill();
    // Highlight
    ctx.fillStyle='rgba(255,255,255,.07)';
    ctx.beginPath();ctx.arc(tx-t.r*.2,ty-t.r*.68,t.r*.32,0,Math.PI*2);ctx.fill();
  });
}

// ── BUILDING RENDERER ────────────────────────────────────────────────────────
function renderBuildings(ctx,VW,VH,GT,PX,PY,inCar){
  BLDS.forEach(function(b){
    var bx=wx(b.x),by=wy(b.y);
    if(bx+b.w<-10||bx>VW+10||by+b.h<-10||by>VH+10)return;
    if(b.house){renderHouse(ctx,bx,by,b);return;}

    // Shadow
    ctx.globalAlpha=.16;ctx.fillStyle='#000';
    ctx.beginPath();ctx.ellipse(bx+b.w/2,by+b.h+6,b.w*.44,9,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;

    // Brick wall body
    var brickH=18,brickW=36;
    for(var row=0;row<Math.ceil(b.h/brickH);row++){
      var off=row%2?brickW/2:0;
      for(var col=0;col<Math.ceil(b.w/brickW)+1;col++){
        var brx=bx+col*brickW-off;
        if(brx<bx)brx=bx;if(brx>=bx+b.w)continue;
        var bw2=Math.min(brickW-2,bx+b.w-brx-1);
        ctx.fillStyle=lighten(b.col,(col+row*.3)%3*.03);
        ctx.fillRect(brx,by+row*brickH,bw2,brickH-1);
        ctx.strokeStyle='rgba(0,0,0,.07)';ctx.lineWidth=.7;
        ctx.strokeRect(brx,by+row*brickH,bw2,brickH-1);
      }
    }

    // Storefront glass (lower 38%)
    var gY=by+b.h*.62,gH=b.h*.38-28;
    ctx.fillStyle='rgba(160,210,250,.45)';ctx.fillRect(bx+4,gY,b.w-8,gH);
    ctx.strokeStyle='rgba(80,140,200,.5)';ctx.lineWidth=2;ctx.strokeRect(bx+4,gY,b.w-8,gH);
    var panes=Math.max(2,Math.floor(b.w/60));
    for(var p=1;p<panes;p++){
      var px2=bx+4+(b.w-8)*p/panes;
      ctx.strokeStyle='rgba(80,140,200,.3)';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(px2,gY);ctx.lineTo(px2,gY+gH);ctx.stroke();
    }

    // Awning
    ctx.fillStyle=b.roof;
    ctx.beginPath();ctx.moveTo(bx-8,gY);ctx.lineTo(bx+b.w+8,gY);
    ctx.lineTo(bx+b.w+14,gY+22);ctx.lineTo(bx-14,gY+22);ctx.closePath();ctx.fill();
    ctx.globalAlpha=.2;ctx.fillStyle='#fff';
    for(var aw=0;aw<b.w/18;aw++)ctx.fillRect(bx+aw*18,gY,9,22);
    ctx.globalAlpha=1;

    // Upper windows
    var uCols=Math.floor(b.w/72),uRows=Math.floor((b.h*.6-30)/42);
    for(var ur=0;ur<uRows;ur++){
      for(var uc=0;uc<uCols;uc++){
        var uwx=bx+10+uc*72,uwy=by+10+ur*42;
        if(uwx+56>bx+b.w-6)break;
        ctx.fillStyle='rgba(160,210,255,.72)';ctx.fillRect(uwx,uwy,56,32);
        ctx.strokeStyle='rgba(80,140,200,.5)';ctx.lineWidth=1.5;ctx.strokeRect(uwx,uwy,56,32);
        ctx.strokeStyle='rgba(80,140,200,.3)';ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(uwx+28,uwy);ctx.lineTo(uwx+28,uwy+32);
        ctx.moveTo(uwx,uwy+16);ctx.lineTo(uwx+56,uwy+16);ctx.stroke();
      }
    }

    // Roof
    ctx.fillStyle=b.roof;
    ctx.beginPath();ctx.moveTo(bx-10,by);ctx.lineTo(bx+b.w/2,by-50);ctx.lineTo(bx+b.w+10,by);ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.18)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(bx-10,by);ctx.lineTo(bx+b.w/2,by-50);ctx.lineTo(bx+b.w+10,by);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.1)';
    ctx.beginPath();ctx.moveTo(bx+b.w*.22,by-18);ctx.lineTo(bx+b.w/2,by-50);ctx.lineTo(bx+b.w*.4,by-20);ctx.closePath();ctx.fill();

    // Sign board
    ctx.fillStyle=b.sc;ctx.beginPath();ctx.roundRect(bx+b.w*.06,by+b.h*.56,b.w*.88,24,5);ctx.fill();
    ctx.font='bold '+Math.max(10,Math.round(b.w*.046))+'px Arial';
    ctx.textAlign='center';ctx.fillStyle=b.st;ctx.fillText(b.sign,bx+b.w/2,by+b.h*.56+17);

    // Emoji
    ctx.font='20px serif';ctx.fillText(b.e,bx+b.w/2,by-16);

    // Door
    ctx.fillStyle='rgba(20,10,5,.82)';ctx.beginPath();ctx.roundRect(bx+b.w/2-12,by+b.h-28,24,28,[8,8,0,0]);ctx.fill();
    ctx.fillStyle='rgba(160,210,255,.5)';ctx.fillRect(bx+b.w/2-10,by+b.h-26,10,22);ctx.fillRect(bx+b.w/2+1,by+b.h-26,9,22);
    ctx.fillStyle='rgba(255,200,80,.8)';ctx.beginPath();ctx.arc(bx+b.w/2+8,by+b.h-14,2.5,0,Math.PI*2);ctx.fill();

    // Entry glow when player nearby
    if(!inCar){
      var doorWX=wx(b.x+b.w/2), doorWY=wy(b.y+b.h-14);
      var dist2=Math.hypot(PX-b.x-b.w/2,PY-b.y-b.h+14);
      if(dist2<75){
        ctx.globalAlpha=.2+.2*Math.abs(Math.sin(GT*.1));
        ctx.fillStyle='#ffff44';ctx.beginPath();ctx.ellipse(doorWX,doorWY+8,24,8,0,0,Math.PI*2);ctx.fill();
        ctx.globalAlpha=1;
        ctx.font='bold 11px Arial';ctx.textAlign='center';
        ctx.strokeStyle='rgba(0,0,0,.8)';ctx.lineWidth=3;
        ctx.strokeText('A — Enter',doorWX,doorWY-20);
        ctx.fillStyle='#fff';ctx.fillText('A — Enter',doorWX,doorWY-20);
      }
    }
  });
}

// ── HOUSE RENDERERS ──────────────────────────────────────────────────────────
function renderHouse(ctx,bx,by,b){
  var hw=b.w,hh=b.h,t=b.htype;
  ctx.globalAlpha=.15;ctx.fillStyle='#000';
  ctx.beginPath();ctx.ellipse(bx+hw/2,by+hh+5,hw*.4,8,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;

  if(t===0){// Colonial — white, red roof, columns
    ctx.fillStyle='#f8f8f0';ctx.fillRect(bx,by,hw,hh);
    ctx.fillStyle='#e8e8e0';for(var ci=0;ci<4;ci++)ctx.fillRect(bx+8+ci*(hw/4-2),by+hh-60,8,60);
    ctx.fillStyle='#c03020';ctx.beginPath();ctx.moveTo(bx-8,by);ctx.lineTo(bx+hw/2,by-50);ctx.lineTo(bx+hw+8,by);ctx.closePath();ctx.fill();
    ctx.fillStyle='#e8e0d0';ctx.fillRect(bx,by,hw,16);
    ctx.fillStyle='rgba(160,210,255,.6)';ctx.fillRect(bx+14,by+20,42,34);ctx.fillRect(bx+hw-56,by+20,42,34);
    ctx.strokeStyle='#888';ctx.lineWidth=1;ctx.strokeRect(bx+14,by+20,42,34);ctx.strokeRect(bx+hw-56,by+20,42,34);
    ctx.fillStyle='#603818';ctx.beginPath();ctx.roundRect(bx+hw/2-10,by+hh-34,20,34,[6,6,0,0]);ctx.fill();
  }else if(t===1){// Ranch — brick, wide/low
    for(var br=0;br<Math.ceil(hh/16);br++){
      for(var bc=0;bc<Math.ceil(hw/32)+1;bc++){
        var broff=br%2?16:0,brbx=bx+bc*32-broff;
        if(brbx<bx)brbx=bx;if(brbx>=bx+hw)continue;
        ctx.fillStyle=br%3===0?'#c07058':'#b06048';
        ctx.fillRect(brbx,by+br*16,Math.min(30,bx+hw-brbx-1),14);
        ctx.strokeStyle='rgba(0,0,0,.08)';ctx.lineWidth=.6;ctx.strokeRect(brbx,by+br*16,Math.min(30,bx+hw-brbx-1),14);
      }
    }
    ctx.fillStyle='#888';ctx.fillRect(bx-8,by-10,hw+16,12);ctx.fillStyle='#999';ctx.fillRect(bx-8,by-10,hw+16,4);
    ctx.fillStyle='rgba(160,210,255,.6)';ctx.fillRect(bx+10,by+16,52,30);ctx.fillRect(bx+hw-62,by+16,52,30);ctx.fillRect(bx+hw/2-22,by+18,44,26);
    ctx.strokeStyle='#777';ctx.lineWidth=1;ctx.strokeRect(bx+10,by+16,52,30);ctx.strokeRect(bx+hw-62,by+16,52,30);
    ctx.fillStyle='#502808';ctx.fillRect(bx+hw/2-11,by+hh-28,22,28);
    ctx.fillStyle='#ffaa20';ctx.beginPath();ctx.arc(bx+hw/2+8,by+hh-14,3,0,Math.PI*2);ctx.fill();
  }else if(t===2){// Victorian — purple, turret, tall
    ctx.fillStyle='#9858c8';ctx.fillRect(bx,by,hw,hh);
    ctx.strokeStyle='#c890f0';ctx.lineWidth=2;
    for(var vi=0;vi<5;vi++){ctx.beginPath();ctx.moveTo(bx+vi*(hw/5),by+hh*.4);ctx.lineTo(bx+vi*(hw/5),by+hh-30);ctx.stroke();}
    ctx.fillStyle='#c890f0';ctx.fillRect(bx,by,hw,8);ctx.fillRect(bx,by+hh*.4,hw,6);
    ctx.fillStyle='#5828a0';ctx.beginPath();ctx.moveTo(bx-8,by);ctx.lineTo(bx+hw/2,by-80);ctx.lineTo(bx+hw+8,by);ctx.closePath();ctx.fill();
    ctx.strokeStyle='#c890f0';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(bx-8,by);ctx.lineTo(bx+hw/2,by-80);ctx.lineTo(bx+hw+8,by);ctx.stroke();
    ctx.fillStyle='#7030b0';ctx.fillRect(bx+hw-30,by-20,26,hh*.5);
    ctx.fillStyle='#5828a0';ctx.beginPath();ctx.moveTo(bx+hw-30,by-20);ctx.lineTo(bx+hw-17,by-52);ctx.lineTo(bx+hw-4,by-20);ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(160,210,255,.6)';ctx.fillRect(bx+10,by+16,38,28);ctx.fillRect(bx+hw-48,by+16,38,28);
    ctx.strokeStyle='#c890f0';ctx.lineWidth=1;ctx.strokeRect(bx+10,by+16,38,28);ctx.strokeRect(bx+hw-48,by+16,38,28);
    ctx.fillStyle='#3a1860';ctx.beginPath();ctx.roundRect(bx+hw/2-10,by+hh-30,20,30,[6,6,0,0]);ctx.fill();
  }else if(t===3){// Modern — gray, flat, large glass
    ctx.fillStyle='#d0d0d8';ctx.fillRect(bx,by,hw,hh);
    ctx.fillStyle='#a0a0b0';ctx.fillRect(bx-4,by-8,hw+8,10);
    ctx.fillStyle='rgba(150,205,255,.65)';ctx.fillRect(bx+8,by+16,hw*.45,hh*.5);ctx.fillRect(bx+hw*.58,by+16,hw*.36,hh*.5);
    ctx.strokeStyle='rgba(80,120,180,.5)';ctx.lineWidth=2;ctx.strokeRect(bx+8,by+16,hw*.45,hh*.5);ctx.strokeRect(bx+hw*.58,by+16,hw*.36,hh*.5);
    ctx.fillStyle='#8888a0';ctx.fillRect(bx,by+hh*.55,hw,6);
    ctx.fillStyle='#2a2a40';ctx.fillRect(bx+hw/2-12,by+hh-30,24,30);
    ctx.fillStyle='rgba(160,200,255,.5)';ctx.fillRect(bx+hw/2-10,by+hh-28,10,24);ctx.fillRect(bx+hw/2+1,by+hh-28,9,24);
  }else if(t===4){// Craftsman bungalow — brown, porch
    ctx.fillStyle='#8a6040';ctx.fillRect(bx,by,hw,hh);
    ctx.fillStyle='#a07858';ctx.fillRect(bx-10,by+hh*.55,hw+20,hh*.45);
    ctx.fillStyle='#8a6040';for(var pi2=0;pi2<4;pi2++)ctx.fillRect(bx+pi2*(hw/3.5),by+hh*.55,8,hh*.45);
    ctx.fillStyle='#502808';ctx.beginPath();ctx.moveTo(bx-18,by);ctx.lineTo(bx+hw/2,by-36);ctx.lineTo(bx+hw+18,by);ctx.closePath();ctx.fill();
    ctx.fillStyle='#602810';ctx.beginPath();ctx.moveTo(bx-18,by+hh*.55);ctx.lineTo(bx+hw/2,by+hh*.55-22);ctx.lineTo(bx+hw+18,by+hh*.55);ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(160,210,255,.6)';ctx.fillRect(bx+12,by+16,44,32);ctx.fillRect(bx+hw-56,by+16,44,32);
    ctx.strokeStyle='#602810';ctx.lineWidth=1;ctx.strokeRect(bx+12,by+16,44,32);ctx.strokeRect(bx+hw-56,by+16,44,32);
    ctx.fillStyle='#401808';ctx.beginPath();ctx.roundRect(bx+hw/2-10,by+hh-28,20,28,[5,5,0,0]);ctx.fill();
  }else{// Cottage — yellow, blue shutters, garden
    ctx.fillStyle='#f0d860';ctx.fillRect(bx,by,hw,hh);
    ctx.fillStyle='rgba(160,210,255,.6)';ctx.fillRect(bx+10,by+18,36,28);ctx.fillRect(bx+hw-46,by+18,36,28);
    ctx.fillStyle='#3060c0';ctx.fillRect(bx+6,by+16,8,32);ctx.fillRect(bx+50,by+16,8,32);ctx.fillRect(bx+hw-52,by+16,8,32);ctx.fillRect(bx+hw-14,by+16,8,32);
    ctx.fillStyle='#a07828';ctx.beginPath();ctx.moveTo(bx-12,by);ctx.lineTo(bx+hw/2,by-46);ctx.lineTo(bx+hw+12,by);ctx.closePath();ctx.fill();
    // Thatched texture
    ctx.globalAlpha=.2;ctx.fillStyle='#c09038';
    for(var th=0;th<6;th++){ctx.beginPath();ctx.moveTo(bx-12+th*(hw/5),by);ctx.lineTo(bx+hw/2,by-46);ctx.lineTo(bx-12+(th+1)*(hw/5),by);ctx.fill();}
    ctx.globalAlpha=1;
    // Garden path stones
    ctx.fillStyle='#c8b888';
    for(var gp=0;gp<4;gp++)ctx.beginPath(),ctx.ellipse(bx+hw/2,by+hh+8+gp*12,8,5,0,0,Math.PI*2),ctx.fill();
    ctx.fillStyle='#5028a0';ctx.beginPath();ctx.roundRect(bx+hw/2-9,by+hh-26,18,26,[5,5,0,0]);ctx.fill();
  }
  // House name tag
  ctx.font='bold 9px Arial';ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,.6)';ctx.beginPath();ctx.roundRect(bx+hw/2-28,by+hh+26,56,14,4);ctx.fill();
  ctx.fillStyle='#fff';ctx.fillText(b.n,bx+hw/2,by+hh+36);
}

// ── CAR RENDERER ─────────────────────────────────────────────────────────────
// All cars drawn from a true top-down (bird's eye) perspective.
// Front of car faces UP when angle=0.
function drawCar(ctx,cx,cy,car){
  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(car.angle);

  var t=car.type, col=car.col, col2=car.col2;

  // Ground shadow
  ctx.globalAlpha=.22;
  ctx.fillStyle='#000';
  ctx.beginPath();ctx.ellipse(0,3,20,9,0,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;

  if(t===0){
    // ── SEDAN (46×78) ─────────────────────────────────────────
    // Body
    ctx.fillStyle=col;ctx.beginPath();ctx.roundRect(-23,-39,46,78,7);ctx.fill();
    // Panel lines (door seams)
    ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(-20,0);ctx.lineTo(20,0);ctx.stroke();        // waist
    ctx.beginPath();ctx.moveTo(-20,-12);ctx.lineTo(-20,10);ctx.stroke();   // left door
    ctx.beginPath();ctx.moveTo(20,-12);ctx.lineTo(20,10);ctx.stroke();     // right door
    // Roof/cabin (lighter, inset)
    ctx.fillStyle=lighten(col,.15);ctx.beginPath();ctx.roundRect(-16,-18,32,36,5);ctx.fill();
    // Windshield (front glass)
    ctx.fillStyle='rgba(180,225,255,.82)';ctx.beginPath();ctx.roundRect(-14,-36,28,18,3);ctx.fill();
    ctx.strokeStyle='rgba(100,160,210,.5)';ctx.lineWidth=1.5;ctx.stroke();
    // Rear window
    ctx.fillStyle='rgba(180,225,255,.7)';ctx.beginPath();ctx.roundRect(-12,16,24,14,3);ctx.fill();
    // Headlights
    ctx.fillStyle='rgba(255,252,200,.98)';
    ctx.beginPath();ctx.roundRect(-22,-38,10,7,2);ctx.fill();
    ctx.beginPath();ctx.roundRect(12,-38,10,7,2);ctx.fill();
    // Taillights
    ctx.fillStyle='rgba(220,30,30,.95)';
    ctx.beginPath();ctx.roundRect(-22,31,10,7,2);ctx.fill();
    ctx.beginPath();ctx.roundRect(12,31,10,7,2);ctx.fill();

// ── MAIN GAME LOOP ────────────────────────────────────────────
var keys={};var joyDx=0,joyDy=0;

function anyOpen(){return!!document.querySelector('.panel.open');}

function update(){
  GT++;G.tick++;
  if(G.tick%1800===0){G.hour=(G.hour+1)%24;if(G.hour===0){G.day++;G.money+=30;toast('☀️ Morning! Day '+G.day+' +$30');} updateHUD();}
  if(G.tick%1000===0){G.money+=Math.floor(4+Math.random()*6);updateHUD();}
  if(G.tick%900===0){P.hunger=Math.max(0,P.hunger-2);P.happy=Math.max(0,P.happy-1);P.energy=Math.max(0,P.energy-1);}
  if(anyOpen()||G.fading)return;
  if(INT.on){updateInterior();return;}
  updateNPCs();
  if(P.inCar){updateCar();}else{updateWalk();}
  updateCam();
}

function updateWalk(){
  var spd=P.spd,ddx=0,ddy=0;
  if(keys['ArrowLeft']||keys['KeyA']){ddx-=spd;P.dir='left';}
  if(keys['ArrowRight']||keys['KeyD']){ddx+=spd;P.dir='right';}
  if(keys['ArrowUp']||keys['KeyW']){ddy-=spd;P.dir='up';}
  if(keys['ArrowDown']||keys['KeyS']){ddy+=spd;P.dir='down';}
  if(joyDx||joyDy){ddx=joyDx*spd;ddy=joyDy*spd;if(Math.abs(joyDx)>Math.abs(joyDy))P.dir=joyDx>0?'right':'left';else if(joyDy)P.dir=joyDy>0?'down':'up';}
  if(ddx&&ddy){ddx*=.707;ddy*=.707;}
  var nx=P.x+ddx,ny=P.y+ddy;
  if(!playerCollides(nx,ny)){P.x=Math.max(30,Math.min(WW-30,nx));P.y=Math.max(60,Math.min(WH-60,ny));}
  else if(!playerCollides(nx,P.y)){P.x=Math.max(30,Math.min(WW-30,nx));}
  else if(!playerCollides(P.x,ny)){P.y=Math.max(60,Math.min(WH-60,ny));}
  P.ftick++;if(P.ftick%10===0&&(ddx||ddy))P.frame=(P.frame+1)%4;
}

function updateCar(){
  var car=P.inCar;
  var fwd=keys['ArrowUp']||keys['KeyW']||joyDy<-.25;
  var bwd=keys['ArrowDown']||keys['KeyS']||joyDy>.25;
  var lft=keys['ArrowLeft']||keys['KeyA']||joyDx<-.25;
  var rgt=keys['ArrowRight']||keys['KeyD']||joyDx>.25;
  if(fwd)car.spd=Math.min(car.spd+.35,8);
  else if(bwd)car.spd=Math.max(car.spd-.4,-4);
  else car.spd*=.9;
  if(lft)car.angle-=.045*(Math.abs(car.spd)/8);
  if(rgt)car.angle+=.045*(Math.abs(car.spd)/8);
  var nx=car.x+Math.sin(car.angle)*car.spd;
  var ny=car.y-Math.cos(car.angle)*car.spd;
  if(!carCollides(nx,ny,car)){car.x=nx;car.y=ny;}else{car.spd*=-.5;}
  P.x=car.x;P.y=car.y;
}

function npcBlocked(nx,ny){
  // River check — block unless at a bridge (X 300-364, 900-964, 1600-1664)
  if(ny>RIVER_Y-8&&ny<RIVER_Y+RIVER_H+8){
    var onBridge=BRIDGE_XS.some(function(bx){return nx>bx-4&&nx<bx+68;});
    if(!onBridge)return true;
  }
  // Building check (shrunk hitbox — NPCs are thin)
  for(var i=0;i<BLDS.length;i++){
    var b=BLDS[i];
    if(nx>b.x+6&&nx<b.x+b.w-6&&ny>b.y+10&&ny<b.y+b.h-6)return true;
  }
  return false;
}
function updateNPCs(){
  NPCS.forEach(function(n,ni){
    n.wtick++;
    if(n.wtick>n.wdelay){
      n.wtick=0;n.wpi=(n.wpi+1)%n.wps.length;n.wdelay=180+Math.floor(Math.random()*280);
    }
    var target=n.wps[n.wpi];
    var dx=target.x-n.x,dy=target.y-n.y,dist=Math.sqrt(dx*dx+dy*dy);
    if(dist>6){
      var spd=1.4;
      var mx=dx/dist*spd, my=dy/dist*spd;
      var nx2=n.x+mx, ny2=n.y+my;
      // Try full move
      if(!npcBlocked(nx2,ny2)){
        n.x=nx2;n.y=ny2;
      } else if(!npcBlocked(n.x+mx,n.y)){
        // Slide X only
        n.x+=mx;
      } else if(!npcBlocked(n.x,n.y+my)){
        // Slide Y only
        n.y+=my;
      }
      // Direction
      if(Math.abs(dx)>Math.abs(dy))n.dir=dx>0?'right':'left';
      else n.dir=dy>0?'down':'up';
      n.ftick++;if(n.ftick%12===0)n.frame=(n.frame+1)%4;
    } else {
      n.frame=0;
      // Reached waypoint — move to next early
      n.wpi=(n.wpi+1)%n.wps.length;n.wtick=0;
    }
    // Mood near player
    var pd=Math.hypot(P.x-n.x,P.y-n.y);
    if(pd<80)n.mood=pd<50?'👋':'😊';
  });
}

function updateInterior(){
  var spd=2.5,dx=0,dy=0;
  if(keys['ArrowLeft']||keys['KeyA']){dx=-spd;}
  if(keys['ArrowRight']||keys['KeyD']){dx=spd;}
  if(keys['ArrowUp']||keys['KeyW']){dy=-spd;}
  if(keys['ArrowDown']||keys['KeyS']){dy=spd;}
  if(joyDx||joyDy){dx=joyDx*spd;dy=joyDy*spd;}
  if(dx&&dy){dx*=.707;dy*=.707;}
  if(Math.abs(dx)>Math.abs(dy))INT.dir=dx>0?'right':'left';else if(dy)INT.dir=dy>0?'down':'up';
  INT.ftick++;if(INT.ftick%10===0&&(dx||dy))INT.frame=(INT.frame+1)%4;
  INT.px=Math.max(24,Math.min(VW-24,INT.px+dx));
  INT.py=Math.max(96,Math.min(VH-48,INT.py+dy));
}

function updateCam(){
  var tx=P.x-VW/2,ty=P.y-VH/2;
  CAM.x+=(tx-CAM.x)*.14;CAM.y+=(ty-CAM.y)*.14;
  CAM.x=Math.max(0,Math.min(WW-VW,CAM.x));CAM.y=Math.max(0,Math.min(WH-VH,CAM.y));
}

function render(){
  if(INT.on){renderInterior(VW,VH);return;}
  renderWorld(ctx,VW,VH,GT);
  renderBuildings(ctx,VW,VH,GT,P.x,P.y,!!P.inCar);
  // Cars
  CARS.forEach(function(car){
    var csx=wx(car.x),csy=wy(car.y);if(csx<-80||csx>VW+80||csy<-80||csy>VH+80)return;
    drawCar(ctx,csx,csy,car);
    if(!car.driven&&!P.inCar&&Math.hypot(P.x-car.x,P.y-car.y)<60){
      ctx.font='bold 11px Arial';ctx.textAlign='center';ctx.strokeStyle='rgba(0,0,0,.8)';ctx.lineWidth=3;
      ctx.strokeText('A — Drive',csx,csy-52);ctx.fillStyle='#fff';ctx.fillText('A — Drive',csx,csy-52);
    }
  });
  // NPCs
  NPCS.forEach(function(n){
    var nx=wx(n.x),ny=wy(n.y);if(nx<-60||nx>VW+60||ny<-60||ny>VH+80)return;
    drawChar(ctx,nx,ny,n,1,n.dir,n.frame,true);
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.beginPath();ctx.roundRect(nx-20,ny-80,40,15,4);ctx.fill();
    ctx.font='bold 8px Arial';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.fillText(n.name,nx,ny-69);
    ctx.font='14px serif';ctx.fillText(n.mood||'😊',nx,ny-82);
  });
  // Player or driving car
  if(P.inCar){drawCar(ctx,wx(P.inCar.x),wy(P.inCar.y),P.inCar);}
  else{
    drawChar(ctx,wx(P.x),wy(P.y),P,1.05,P.dir,P.frame,true);
    ctx.fillStyle='rgba(0,50,0,.72)';ctx.beginPath();ctx.roundRect(wx(P.x)-22,wy(P.y)-84,44,14,4);ctx.fill();
    ctx.font='bold 8px Arial';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.fillText(P.name,wx(P.x),wy(P.y)-74);
    ctx.font='14px serif';ctx.fillText(getMood(),wx(P.x),wy(P.y)-86);
  }
  if(G.fade>0){ctx.fillStyle='rgba(0,0,0,'+G.fade+')';ctx.fillRect(0,0,VW,VH);}
}

function getMood(){var a=(P.hunger+P.happy+P.energy)/3;return a>80?'😄':a>65?'🙂':a>45?'😐':a>25?'😔':'😫';}

// ── INPUT ─────────────────────────────────────────────────────
document.addEventListener('keydown',function(e){
  keys[e.code]=true;
  if(e.code==='KeyE'||e.code==='Enter'){doAction();}
  if(e.code==='Escape'||e.code==='KeyQ'){doBack();}
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
});
document.addEventListener('keyup',function(e){delete keys[e.code];});

function doAction(){
  if(anyOpen()){return;}
  if(INT.on){doInteriorAction();return;}
  for(var i=0;i<CARS.length;i++){var car=CARS[i];if(!car.driven&&Math.hypot(P.x-car.x,P.y-car.y)<65){enterCar(car);return;}}
  if(P.inCar){exitCar();return;}
  for(var j=0;j<BLDS.length;j++){var b=BLDS[j];var doorX=b.x+b.w/2,doorY=b.y+b.h-14;if(Math.hypot(P.x-doorX,P.y-doorY)<90){enterBuilding(b);return;}}
  for(var k=0;k<NPCS.length;k++){var n=NPCS[k];if(Math.hypot(P.x-n.x,P.y-n.y)<65){showDlg(n.name,n.line);return;}}
}
function doBack(){if(INT.on){exitInt();return;}if(P.inCar){exitCar();return;}closeAllPanels();}

// A-button inside store: find nearest item to player and toggle it
function doInteriorAction(){
  var sd=STORES[INT.bld.id];if(!sd)return;
  // Near exit?
  if(INT.py>VH-70){exitInt();return;}
  // Near checkout counter?
  if(INT.py>VH-130&&Math.abs(INT.px-VW/2)<150){openCheckout();return;}
  // Find nearest shelf item
  var tab=_stab[INT.bld.id]||0;
  var items=sd.items.filter(function(it){return it.t===tab;});
  var cols=Math.max(2,Math.floor((VW-40)/96));
  var colW=(VW-36)/cols;
  var best=null,bestDist=90;
  items.forEach(function(item,i){
    var col2=i%cols,row2=Math.floor(i/cols);
    var sx=18+col2*colW+44, sy=90+row2*110+33; // centre of item card
    var d=Math.hypot(INT.px-sx,INT.py-sy);
    if(d<bestDist){bestDist=d;best=item;}
  });
  if(best){
    var ic=P.cart.some(function(c){return c.n===best.n;});
    if(ic){P.cart=P.cart.filter(function(c){return c.n!==best.n;});toast('Removed '+best.n+' from cart');}
    else{P.cart.push(best);toast(best.n+' added to cart! \ud83d\uded2');}
  }
}

function handleIntTap(tapX,tapY){
  var sd=STORES[INT.bld.id];if(!sd)return;
  // Exit strip at bottom
  if(tapY>VH-58&&tapX>VW/2-60&&tapX<VW/2+60){exitInt();return;}
  // Checkout button
  if(tapX>VW/2+10&&tapX<VW/2+134&&tapY>VH-100&&tapY<VH-58){openCheckout();return;}
  // Tabs
  var tabX=10;sd.tabs.forEach(function(tb,i){
    var tw=tb.length*7+26;
    if(tapX>tabX&&tapX<tabX+tw&&tapY>VH-58&&tapY<VH-28){_stab[INT.bld.id]=i;}
    tabX+=tw;
  });
  // Item grid — must match renderInterior exactly
  var tab=_stab[INT.bld.id]||0;
  var items=sd.items.filter(function(it){return it.t===tab;});
  var cols=Math.max(2,Math.floor((VW-40)/96));
  var colW=(VW-36)/cols;
  items.forEach(function(item,i){
    var col2=i%cols,row2=Math.floor(i/cols);
    var sx=18+col2*colW, sy=90+row2*110;
    if(sy+90>VH-100)return;
    if(tapX>=sx-6&&tapX<=sx+94&&tapY>=sy-6&&tapY<=sy+80){
      var ic=P.cart.some(function(c){return c.n===item.n;});
      if(ic){P.cart=P.cart.filter(function(c){return c.n!==item.n;});toast('Removed '+item.n);}
      else{P.cart.push(item);toast(item.n+' added! 🛒');}
    }
  });
}

// ── BUILDING ENTRY ────────────────────────────────────────────
function enterBuilding(b){
  if(G.fading)return;
  if(!b.store||!STORES[b.id]){showDlg(b.n,'Welcome to '+b.n+'! 🏠');return;}
  P.cart=[];
  fade(1,function(){INT.on=true;INT.bld=b;INT.px=VW/2;INT.py=VH*.72;INT.dir='up';INT.frame=0;fade(0);});
}
function exitInt(){
  if(G.fading)return;
  fade(1,function(){INT.on=false;INT.bld=null;P.cart=[];fade(0);});
}
function enterCar(car){car.driven=true;P.inCar=car;toast('🚗 Driving! Steer with controls. E/A=exit');}
function exitCar(){if(!P.inCar)return;P.inCar.driven=false;P.inCar.spd=0;P.x=P.inCar.x+50;P.y=P.inCar.y+70;P.inCar=null;toast('Exited vehicle!');}

function fade(to,cb){
  G.fading=true;var step=to>G.fade?.07:-.07;
  var iv=setInterval(function(){
    G.fade=Math.round((G.fade+step)*100)/100;
    if(to===1&&G.fade>=1){G.fade=1;clearInterval(iv);G.fading=false;if(cb)cb();}
    else if(to===0&&G.fade<=0){G.fade=0;clearInterval(iv);G.fading=false;if(cb)cb();}
  },20);
}

// ── CHECKOUT ──────────────────────────────────────────────────
function openCheckout(){
  if(!P.cart.length){toast('Cart is empty! Tap items on the shelves to add them. 🛒');return;}
  var total=P.cart.reduce(function(s,c){return s+c.p;},0);
  var sd=STORES[INT.bld.id];
  var html='<div class="ptit">🛒 Checkout</div><div style="background:'+sd.col+';color:#fff;border-radius:10px;padding:10px 14px;margin-bottom:12px;font-weight:700;font-size:.85rem">'+sd.n+' — Teller: '+sd.tel+'</div>';
  P.cart.forEach(function(item){html+='<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #f0f0f0"><span style="font-size:1.3rem">'+item.e+'</span><span style="flex:1;font-size:.82rem;font-weight:700">'+item.n+'</span><span style="color:#2a8703;font-weight:700;font-size:.82rem">$'+item.p+'</span></div>';});
  html+='<div style="margin-top:12px;padding-top:10px;border-top:2px solid #eee;display:flex;justify-content:space-between;align-items:center"><span style="font-size:1rem;font-weight:900">Total: $'+total+'</span><span style="font-size:.8rem;color:#888">Wallet: $'+G.money+'</span></div>';
  if(total>G.money)html+='<div style="color:#ea1100;font-size:.78rem;margin-top:8px">⚠️ Not enough money!</div>';
  html+='<div style="display:flex;gap:10px;margin-top:14px;justify-content:center">';
  if(total<=G.money)html+='<button class="btn gr" onclick="confirmCheckout()">✅ Pay $'+total+'</button>';
  html+='<button class="btn rd sm" onclick="closePanel(\'checkout-panel\')">Cancel</button></div>';
  document.getElementById('checkout-pi').innerHTML=html;openPanel('checkout-panel');
}
function confirmCheckout(){
  var total=P.cart.reduce(function(s,c){return s+c.p;},0);
  if(total>G.money){toast('Not enough money! 💸');return;}
  G.money-=total;
  P.cart.forEach(function(item){if(item.eff){if(item.eff.hunger)P.hunger=Math.min(100,P.hunger+(item.eff.hunger||0));if(item.eff.happy)P.happy=Math.min(100,P.happy+(item.eff.happy||0));if(item.eff.energy)P.energy=Math.min(100,P.energy+(item.eff.energy||0));}if(item.keep)P.inventory.push({e:item.e,n:item.n});});
  var count=P.cart.length;P.cart=[];closePanel('checkout-panel');updateHUD();
  toast('Purchased '+count+' items! 🎉');
  var sd=STORES[INT.bld.id];
  showDlg(sd.tel||'Teller','Thank you so much! Have a wonderful day! 😊 Come back soon!');
  setTimeout(function(){exitInt();},300);
}

// ── PANELS / HUD ──────────────────────────────────────────────
function openPanel(id){
  if(id==='inv-panel')renderInv();
  if(id==='mood-panel')renderMood();
  if(id==='creator-panel')renderCreatorPanel();
  document.getElementById(id).classList.add('open');
}
function closePanel(id){document.getElementById(id).classList.remove('open');}
function closeAllPanels(){document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('open');});}

function renderInv(){
  var el=document.getElementById('inv-pi');el.innerHTML='<div class="ptit">🎒 Your Bag</div>';
  if(!P.inventory.length){el.innerHTML+='<p style="text-align:center;color:#aaa;padding:16px">Empty! Shop at stores to fill it up.</p>';return;}
  var g='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:10px">';
  P.inventory.forEach(function(it){g+='<div style="background:#f8f8f8;border:2px solid #eee;border-radius:8px;padding:8px;text-align:center"><div style="font-size:1.4rem">'+it.e+'</div><div style="font-size:.6rem;color:#555;margin-top:3px">'+it.n+'</div></div>';});
  el.innerHTML+=g+'</div>';
}
function renderMood(){
  var el=document.getElementById('mood-pi');
  var avg=Math.round((P.hunger+P.happy+P.energy)/3);
  var html='<div class="ptit">'+getMood()+' '+P.name+'\'s Status</div>';
  html+='<div style="text-align:center;font-size:3.5rem;margin-bottom:10px">'+getMood()+'</div>';
  function nb(i,l,v,c){return'<div class="nb"><span style="width:22px;text-align:center">'+i+'</span><div class="nbg"><div class="nf" style="width:'+v+'%;background:'+c+'"></div></div><span style="font-size:.7rem;color:#888;width:32px">'+v+'%</span></div>';}
  html+=nb('🍔','Hunger',P.hunger,'#e67e22')+nb('😊','Happy',P.happy,'#e74c3c')+nb('⚡','Energy',P.energy,'#3498db');
  html+='<div style="text-align:center;margin-top:10px;font-size:.8rem;color:#888">Overall '+avg+'% — '+(avg>80?'Feeling great!':avg>60?'Doing well':avg>40?'Could be better':'Needs attention!')+'</div>';
  html+='<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px"><button class="btn gr sm" onclick="quickEat()">🍎 Snack</button><button class="btn bl sm" onclick="quickPlay()">🎮 Play</button><button class="btn" style="background:#7828a8" onclick="quickRest()">💤 Rest</button></div>';
  el.innerHTML=html;
}
function quickEat(){P.hunger=Math.min(100,P.hunger+18);renderMood();toast('Yum! +18 hunger 🍎');}
function quickPlay(){P.happy=Math.min(100,P.happy+15);renderMood();toast('That was fun! +15 happy 🎮');}
function quickRest(){P.energy=Math.min(100,P.energy+25);renderMood();toast('Refreshed! +25 energy 💤');}

function renderCreatorPanel(){
  var el=document.getElementById('creator-pi');
  var html='<div class="ptit">✏️ Change Your Look</div><div style="text-align:center;margin-bottom:12px"><canvas id="cr-prev2" width="80" height="105" style="border:2px solid #bdb;border-radius:10px;background:#e8f8e8"></canvas></div>';
  function sw2(label,arr,field){var r='<div style="margin-bottom:10px"><span style="font-size:.72rem;font-weight:700;color:#2a7a2a;display:block;margin-bottom:5px">'+label+'</span><div class="crrow">';arr.forEach(function(c,i){r+='<div class="sw'+(P[field]===i?' on':'')+'" style="background:'+c+'" onclick="setP(\''+field+'\','+i+')"></div>';});return r+'</div></div>';}
  function ch2(label,arr,field){var r='<div style="margin-bottom:10px"><span style="font-size:.72rem;font-weight:700;color:#2a7a2a;display:block;margin-bottom:5px">'+label+'</span><div class="crrow">';arr.forEach(function(c,i){r+='<div class="ch'+(P[field]===i?' on':'')+'" onclick="setP(\''+field+'\','+i+')">'+(typeof c==='object'?c.n:c)+'</div>';});return r+'</div></div>';}
  html+=sw2('Skin',SKINS,'skin')+ch2('Hair',HAIRS,'hair')+sw2('Hair Color',HAIRC,'hairc')+sw2('Eye Color',EYEC,'eyec')+ch2('Outfit',OUTF,'outfit');
  el.innerHTML=html;
  setTimeout(function(){var c2=document.getElementById('cr-prev2');if(c2)drawChar(c2.getContext('2d'),40,96,P,1,'down',0,false);},30);
}
function setP(field,val){P[field]=val;renderCreatorPanel();}

var _tt;
function toast(msg){var el=document.getElementById('toast');el.textContent=msg;el.style.opacity='1';clearTimeout(_tt);_tt=setTimeout(function(){el.style.opacity='0';},3000);}
function showDlg(name,text){document.getElementById('dlg-n').textContent=name;document.getElementById('dlg-t').textContent=text;document.getElementById('dlg').style.display='block';}
function closeDlg(){document.getElementById('dlg').style.display='none';}
function updateHUD(){
  document.getElementById('hmoney').textContent='💰 $'+G.money;
  var h=G.hour%12||12,ap=G.hour<12?'AM':'PM';
  document.getElementById('hday').textContent='Day '+G.day+' '+h+ap+(G.hour<6||G.hour>=20?' 🌙':' ☀️');
}

// ── CREATOR UI ────────────────────────────────────────────────
function showScreen(id){document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('on');});if(id){var el=document.getElementById(id);if(el)el.classList.add('on');}}
function buildCreatorUI(){
  function sw(id,arr,field){var el=document.getElementById(id);if(!el)return;el.innerHTML='';arr.forEach(function(c,i){var d=document.createElement('div');d.className='sw'+(CR[field]===i?' on':'');d.style.background=c;d.onclick=function(){CR[field]=i;buildCreatorUI();};el.appendChild(d);});}
  function ch(id,arr,field){var el=document.getElementById(id);if(!el)return;el.innerHTML='';arr.forEach(function(c,i){var d=document.createElement('div');d.className='ch'+(CR[field]===i?' on':'');d.textContent=typeof c==='object'?c.n:c;d.onclick=function(){CR[field]=i;buildCreatorUI();};el.appendChild(d);});}
  sw('cr-skin',SKINS,'skin');ch('cr-hair',HAIRS,'hair');sw('cr-hairc',HAIRC,'hairc');sw('cr-eyec',EYEC,'eyec');ch('cr-outfit',OUTF,'outfit');
  var cv2=document.getElementById('crprev');if(cv2){var ctx2=cv2.getContext('2d');ctx2.clearRect(0,0,88,115);drawChar(ctx2,44,108,CR,1,'down',0,false);}
}
function finishCreator(){
  var nm=(document.getElementById('cr-name')||{}).value||'';
  P.name=nm.trim()||'Player';P.skin=CR.skin;P.hair=CR.hair;P.hairc=CR.hairc;P.eyec=CR.eyec;P.outfit=CR.outfit;
  showScreen(null);startGame();
}

// ── TOUCH ─────────────────────────────────────────────────────
function initTouch(){
  document.getElementById('ctrl').style.display='block';
  var jb=document.getElementById('jb'),jk=document.getElementById('jk'),jId=null,jRect;
  jb.addEventListener('touchstart',function(e){e.preventDefault();jRect=jb.getBoundingClientRect();jId=e.changedTouches[0].identifier;},{passive:false});
  document.addEventListener('touchmove',function(e){
    if(jId===null)return;
    for(var i=0;i<e.changedTouches.length;i++){
      if(e.changedTouches[i].identifier===jId){
        var t=e.changedTouches[i],dx=t.clientX-(jRect.left+52),dy=t.clientY-(jRect.top+52),dist=Math.sqrt(dx*dx+dy*dy),max=40;
        if(dist>max){dx=dx/dist*max;dy=dy/dist*max;}
        jk.style.left=(29+dx)+'px';jk.style.top=(29+dy)+'px';joyDx=dx/max;joyDy=dy/max;break;
      }
    }
  },{passive:false});
  document.addEventListener('touchend',function(e){for(var i=0;i<e.changedTouches.length;i++){if(e.changedTouches[i].identifier===jId){jId=null;joyDx=0;joyDy=0;jk.style.left='29px';jk.style.top='29px';break;}}},{passive:false});
  document.getElementById('ab-a').addEventListener('touchstart',function(e){
    e.preventDefault();
    if(INT.on){
      var t2=e.changedTouches[0];
      handleIntTap(t2.clientX,t2.clientY);
    }else{
      doAction();
    }
  },{passive:false});
  document.getElementById('ab-b').addEventListener('touchstart',function(e){e.preventDefault();doBack();},{passive:false});
  cv.addEventListener('touchstart',function(e){
    if(!INT.on)return;
    var t2=e.changedTouches[0];
    handleIntTap(t2.clientX,t2.clientY);
  },{passive:false});
  document.addEventListener('touchmove',function(e){if(!e.target.closest('#jb'))e.preventDefault();},{passive:false});
}

// ── START ─────────────────────────────────────────────────────
function startGame(){
  document.getElementById('hud').style.display='flex';
  if(isMobile)initTouch();
  CAM.x=P.x-VW/2;CAM.y=P.y-VH/2;
  updateHUD();
  toast('Welcome '+P.name+'! Walk with arrow keys. Press E to enter buildings. A to drive! 🏝️');
  requestAnimationFrame(loop);
}
function loop(){requestAnimationFrame(loop);update();render();}
window.addEventListener('resize',function(){VW=innerWidth;VH=innerHeight;cv.width=VW;cv.height=VH;});
